<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Leitor de Gabarito - Completo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #000;
            padding: 10px;
            max-width: 500px;
            margin: auto;
        }
        .header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 8px;
        }
        .header h1 { font-size: 1rem; color: white; }
        
        .info-bar {
            background: #222;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            font-size: 0.7rem;
            color: #aaa;
            flex-wrap: wrap;
            gap: 4px;
        }
        .info-bar span { color: white; }
        
        .status {
            background: rgba(0,0,0,0.8);
            padding: 8px;
            border-radius: 8px;
            text-align: center;
            font-size: 0.75rem;
            margin-bottom: 6px;
            font-weight: bold;
            color: #ffaa00;
        }
        .status.good { background: rgba(0, 100, 0, 0.9); color: #00ff00; }
        .status.detected { background: rgba(0, 60, 100, 0.9); color: #00ccff; }
        .status.estavel { background: rgba(0, 80, 0, 0.9); color: #00ff00; }
        .status.error { background: rgba(100, 0, 0, 0.9); color: #ff4444; }
        .status.capturado { background: rgba(0, 100, 80, 0.9); color: #00ffaa; }
        
        .camera-container {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 8px;
            aspect-ratio: 3/4;
            border: 2px solid #333;
        }
        .camera-container.estavel { border-color: #00ff00; box-shadow: 0 0 20px rgba(0,255,0,0.2); }
        .camera-container.capturado { border-color: #00ffaa; box-shadow: 0 0 20px rgba(0,255,170,0.3); }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        
        .badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #00c853;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: bold;
            display: none;
            z-index: 10;
        }
        .badge.visible { display: block; }
        
        .controles {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .controles button {
            flex: 1;
            min-width: 40px;
            padding: 8px 4px;
            font-size: 0.6rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #333;
            color: white;
            transition: all 0.2s;
        }
        .controles button:active { transform: scale(0.95); }
        .btn-ajuste { background: #2196f3; }
        .btn-zoom { background: #4caf50; }
        .btn-capturar { 
            background: #ff6f00; 
            animation: pulse 1.5s infinite;
            min-width: 70px;
        }
        .btn-capturar.capturado {
            background: #00c853;
            animation: none;
        }
        .btn-reset { background: #666; }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        
        .row-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }
        .row-buttons button {
            flex: 1;
            padding: 10px;
            font-size: 0.7rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
        .btn-prev { background: #1a73e8; color: white; }
        .btn-prev.ativo { background: #f44336; }
        .btn-provas { background: #4caf50; color: white; }
        .btn-gabarito { background: #3c39f5; color: white; }
        .btn-sair { background: #dc3545; color: white; }
        
        .sliders {
            background: #222;
            padding: 8px 10px;
            border-radius: 8px;
            margin-bottom: 6px;
        }
        .sliders label { color: #aaa; font-size: 0.5rem; display: block; }
        .sliders input[type="range"] { width: 100%; margin: 2px 0; }
        .sliders span { color: white; font-size: 0.5rem; }
        .slider-row { display: flex; gap: 10px; }
        .slider-row > div { flex: 1; }
        
        .resultado {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 10px;
            margin-top: 6px;
            display: none;
        }
        .resultado.capturado { border: 2px solid #00ffaa; }
        .nota {
            font-size: 1.2rem;
            color: #4caf50;
            text-align: center;
            font-weight: bold;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            max-height: 120px;
            overflow-y: auto;
            margin-top: 6px;
        }
        .item {
            padding: 2px;
            border-radius: 3px;
            text-align: center;
            font-size: 0.45rem;
            color: white;
        }
        .certa { background: #1b5e1b; }
        .errada { background: #8b1a1a; }
        .vazio { background: #444; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            padding: 20px;
            overflow-y: auto;
        }
        .modal-content {
            background: #1e1e1e;
            border-radius: 16px;
            padding: 20px;
            max-width: 500px;
            margin: auto;
            color: white;
        }
        .modal-content h2 { text-align: center; margin-bottom: 15px; color: #1a73e8; font-size: 1rem; }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: #333;
            color: white;
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .modal-content label { display: block; font-size: 0.75rem; color: #aaa; margin-top: 10px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; }
        .btn-salvar { background: #4caf50; color: white; }
        .btn-fechar { background: #666; color: white; }
        .btn-reset-gabarito { background: #ff4444; color: white; margin-top: 10px; padding: 12px; border-radius: 12px; border: none; width: 100%; cursor: pointer; font-weight: bold; }
        
        .lista-provas { max-height: 300px; overflow-y: auto; margin: 10px 0; }
        .prova-item {
            background: #2c2c2c;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .prova-item:hover { background: #3c3c3c; }
        .prova-nome { font-weight: bold; font-size: 0.8rem; }
        .prova-detalhes { font-size: 0.6rem; color: #aaa; }
        .prova-acoes button { 
            background: none; border: none; color: white; cursor: pointer; 
            padding: 4px 8px; border-radius: 6px; font-size: 0.7rem;
        }
        .btn-edit { background: #2196f3; }
        .btn-del { background: #ff4444; }
        .btn-nova { background: #4caf50; color: white; padding: 12px; border-radius: 12px; border: none; width: 100%; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        
        .gabarito-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            max-height: 300px;
            overflow-y: auto;
            padding: 5px;
        }
        .gab-item {
            background: #2c2c2c;
            padding: 4px;
            border-radius: 4px;
            text-align: center;
        }
        .gab-item label { font-size: 0.5rem; color: #aaa; display: block; }
        .gab-item select {
            width: 100%;
            padding: 2px;
            border-radius: 3px;
            background: #444;
            color: white;
            border: none;
            font-size: 0.6rem;
            text-align: center;
        }
        #infoDetalhe {
            color: #888;
            text-align: center;
            font-size: 0.55rem;
            padding: 2px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📸 Leitor de Gabarito</h1>
    </div>
    
    <div class="info-bar">
        <div>👨‍🏫 <span id="infoUsuario">Professor</span></div>
        <div>📋 <span id="infoProva">Nenhuma</span></div>
        <div id="infoGabarito" style="color:#ff4444;">⚠️</div>
    </div>
    
    <div class="status" id="status">🟡 Aguardando câmera...</div>
    
    <div class="camera-container" id="cameraContainer">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlayCanvas"></canvas>
        <div class="badge" id="badge">✅ CAPTURADO</div>
    </div>
    
    <div id="infoDetalhe">🔍 Posicione a folha - estabilização automática</div>
    
    <div class="controles">
        <button class="btn-ajuste" id="btnCima">⬆</button>
        <button class="btn-ajuste" id="btnBaixo">⬇</button>
        <button class="btn-ajuste" id="btnEsquerda">⬅</button>
        <button class="btn-ajuste" id="btnDireita">➡</button>
        <button class="btn-zoom" id="btnZoomMais">🔍+</button>
        <button class="btn-zoom" id="btnZoomMenos">🔍-</button>
        <button class="btn-capturar" id="btnCapturar">📸 CAPTURAR</button>
        <button class="btn-reset" id="btnReset">⟲</button>
    </div>
    <div id="infoDetalhe" style="color:#666;">Ajuste: X:0 | Y:0 | Zoom:1.00</div>
    
    <div class="row-buttons">
        <button class="btn-prev" id="btnPreview">🎯 Prévia</button>
        <button class="btn-provas" id="btnProvas">📚 Provas</button>
        <button class="btn-gabarito" id="btnGabarito">📝 Editar</button>
        <button class="btn-sair" id="btnSair">🚪 Sair</button>
    </div>
    
    <div class="sliders">
        <div class="slider-row">
            <div>
                <label>🔧 Limiar: <span id="limiarVal">50</span></label>
                <input type="range" id="limiarSlider" min="20" max="150" value="50">
            </div>
            <div>
                <label>📊 Sensib.: <span id="sensVal">0.22</span></label>
                <input type="range" id="sensSlider" min="0.10" max="0.50" step="0.01" value="0.22">
            </div>
            <div>
                <label>📐 Estab.: <span id="estabVal">3</span></label>
                <input type="range" id="estabSlider" min="2" max="8" step="1" value="3">
            </div>
        </div>
    </div>
    
    <div class="resultado" id="resultado">
        <div class="nota" id="nota">🎓 NOTA: -</div>
        <div class="grid" id="grid"></div>
    </div>
    
    <!-- Modal Provas -->
    <div id="modalProvas" class="modal">
        <div class="modal-content">
            <h2>📚 Minhas Provas</h2>
            <button class="btn-nova" id="btnNovaProva">➕ Criar Nova Prova</button>
            <div class="lista-provas" id="listaProvas"></div>
            <button class="btn-fechar" id="btnFecharProvas">Fechar</button>
        </div>
    </div>
    
    <!-- Modal Editar Prova -->
    <div id="modalEditar" class="modal">
        <div class="modal-content">
            <h2 id="modalTitulo">📝 Criar Prova</h2>
            <label>📛 Nome da prova</label>
            <input type="text" id="provaNome" placeholder="Ex: Prova 1 - Matemática">
            <label>📊 Quantidade de questões</label>
            <input type="number" id="provaNumQuestoes" value="40" min="10" max="100" step="5">
            <label>🔤 Número de alternativas</label>
            <select id="provaNumOpcoes">
                <option value="4">4 opções (A-D)</option>
                <option value="5">5 opções (A-E)</option>
            </select>
            <div class="modal-buttons">
                <button class="btn-salvar" id="btnSalvarProva">💾 Salvar</button>
                <button class="btn-fechar" id="btnCancelarEditar">Cancelar</button>
            </div>
        </div>
    </div>
    
    <!-- Modal Gabarito -->
    <div id="modalGabarito" class="modal">
        <div class="modal-content">
            <h2>📝 Editar Gabarito</h2>
            <div class="gabarito-grid" id="gabaritoGrid"></div>
            <div class="modal-buttons">
                <button class="btn-salvar" id="btnSalvarGabarito">💾 Salvar</button>
                <button class="btn-fechar" id="btnFecharGabarito">Fechar</button>
            </div>
            <button class="btn-reset-gabarito" id="btnResetGabarito">🔄 Resetar Gabarito</button>
        </div>
    </div>
    
    <script>
        // ========== CONFIGURAÇÕES ==========
        const SUPABASE_URL = 'https://jmxtiaauezblgkichekx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpteHRpYWF1ZXpibGdraWNoZWt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDIyNjIsImV4cCI6MjA5NDYxODI2Mn0.jD0KRpdl85Cee24qwmV9nDNntR2Wk48DlJLcJnxoTyg';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const LINHAS = 20;
        const COLUNAS = 2;
        const OPCOES = ['A', 'B', 'C', 'D'];
        
        let provas = [];
        let provaAtual = null;
        let NUM_QUESTOES = 40;
        let gabarito = [];
        let opcoesAtuais = OPCOES;
        let numOpcoes = 4;
        
        let ajusteX = 0, ajusteY = 0, zoomGrade = 1.0, margem = 0.02;
        let capturado = false, resultadoCapturado = null;
        let framesEstaveis = 0, framesParaEstabilizar = 3, gradeEstavel = false;
        let historicoQuadrados = [];
        const MAX_HIST = 5;
        let ultimaDeteccao = null;
        let leituraAtiva = false;
        let frameInterval = null;
        let stream = null;
        
        let limiarDetecao = 50;
        let sensibilidade = 0.22;
        
        const usuarioId = localStorage.getItem('usuario_id') || 'user_123';
        const usuarioNome = localStorage.getItem('usuario_nome') || 'Professor';
        
        // Elementos
        const video = document.getElementById('video');
        const canvas = document.getElementById('overlayCanvas');
        const cameraContainer = document.getElementById('cameraContainer');
        const badge = document.getElementById('badge');
        const statusEl = document.getElementById('status');
        const deteccaoInfo = document.getElementById('infoDetalhe');
        const resultadoEl = document.getElementById('resultado');
        const notaEl = document.getElementById('nota');
        const gridEl = document.getElementById('grid');
        
        document.getElementById('infoUsuario').textContent = usuarioNome;
        
        // Sliders
        document.getElementById('limiarSlider').addEventListener('input', e => {
            limiarDetecao = parseInt(e.target.value);
            document.getElementById('limiarVal').textContent = limiarDetecao;
            resetarEstabilizacao();
        });
        document.getElementById('sensSlider').addEventListener('input', e => {
            sensibilidade = parseFloat(e.target.value);
            document.getElementById('sensVal').textContent = sensibilidade.toFixed(2);
        });
        document.getElementById('estabSlider').addEventListener('input', e => {
            framesParaEstabilizar = parseInt(e.target.value);
            document.getElementById('estabVal').textContent = framesParaEstabilizar;
            resetarEstabilizacao();
        });
        
        // Controles
        ['btnCima','btnBaixo','btnEsquerda','btnDireita'].forEach(id => {
            document.getElementById(id).addEventListener('click', () => {
                const step = id.includes('Cima') ? -0.003 : id.includes('Baixo') ? 0.003 : id.includes('Esquerda') ? -0.003 : 0.003;
                if (id.includes('Cima') || id.includes('Baixo')) ajusteY += step;
                else ajusteX += step;
                atualizarInfo();
                resetarEstabilizacao();
                resetarCaptura();
            });
        });
        document.getElementById('btnZoomMais').addEventListener('click', () => {
            zoomGrade = Math.min(zoomGrade + 0.03, 1.3);
            atualizarInfo();
            resetarEstabilizacao();
            resetarCaptura();
        });
        document.getElementById('btnZoomMenos').addEventListener('click', () => {
            zoomGrade = Math.max(zoomGrade - 0.03, 0.7);
            atualizarInfo();
            resetarEstabilizacao();
            resetarCaptura();
        });
        document.getElementById('btnReset').addEventListener('click', () => {
            ajusteX = 0; ajusteY = 0; zoomGrade = 1.0;
            atualizarInfo();
            resetarEstabilizacao();
            resetarCaptura();
        });
        
        function atualizarInfo() {
            document.querySelector('#infoDetalhe').textContent = 
                `Ajuste: X:${(ajusteX*100).toFixed(1)}% | Y:${(ajusteY*100).toFixed(1)}% | Zoom:${zoomGrade.toFixed(2)} | Estab:${framesEstaveis}/${framesParaEstabilizar}`;
        }
        
        function resetarEstabilizacao() {
            framesEstaveis = 0;
            gradeEstavel = false;
            historicoQuadrados = [];
            cameraContainer.classList.remove('estavel');
            if (!capturado) deteccaoInfo.textContent = '🔄 Aguardando estabilização...';
        }
        
        function resetarCaptura() {
            capturado = false;
            resultadoCapturado = null;
            cameraContainer.classList.remove('capturado');
            badge.classList.remove('visible');
            document.getElementById('btnCapturar').textContent = '📸 CAPTURAR';
            document.getElementById('btnCapturar').classList.remove('capturado');
            resultadoEl.classList.remove('capturado');
            statusEl.classList.remove('capturado');
        }
        
        // ========== FUNÇÕES SUPABASE ==========
        async function carregarProvas() {
            const { data } = await supabase
                .from('provas')
                .select('*')
                .eq('usuario_id', usuarioId)
                .order('criado_em', { ascending: false });
            provas = data || [];
            renderizarListaProvas();
            if (provas.length > 0 && !provaAtual) {
                await selecionarProva(provas[0].id);
            }
        }
        
        async function selecionarProva(id) {
            const { data } = await supabase
                .from('provas')
                .select('*')
                .eq('id', id)
                .single();
            if (data) {
                provaAtual = data;
                NUM_QUESTOES = data.num_questoes;
                numOpcoes = data.opcoes_por_questao || 4;
                opcoesAtuais = Array(numOpcoes).fill().map((_,i) => String.fromCharCode(65+i));
                gabarito = [...data.gabarito];
                document.getElementById('infoProva').textContent = provaAtual.nome_prova;
                document.getElementById('infoGabarito').textContent = '✅';
                document.getElementById('infoGabarito').style.color = '#4caf50';
                document.getElementById('btnGabarito').disabled = false;
                resetarCaptura();
                resetarEstabilizacao();
            }
        }
        
        async function salvarProva(nome, numQ, numOps, editId = null) {
            const ops = Array(numOps).fill().map((_,i) => String.fromCharCode(65+i));
            const novoGab = new Array(numQ).fill(ops[0]);
            if (editId) {
                await supabase.from('provas').update({
                    nome_prova: nome, num_questoes: numQ,
                    opcoes_por_questao: numOps, gabarito: novoGab
                }).eq('id', editId);
            } else {
                await supabase.from('provas').insert([{
                    usuario_id: usuarioId, nome_prova: nome,
                    num_questoes: numQ, opcoes_por_questao: numOps,
                    gabarito: novoGab
                }]);
            }
            await carregarProvas();
        }
        
        async function excluirProva(id) {
            if (!confirm('Excluir esta prova?')) return;
            await supabase.from('provas').delete().eq('id', id);
            if (provaAtual && provaAtual.id === id) {
                provaAtual = null;
                document.getElementById('infoProva').textContent = 'Nenhuma';
                document.getElementById('infoGabarito').textContent = '⚠️';
                document.getElementById('infoGabarito').style.color = '#ff4444';
                document.getElementById('btnGabarito').disabled = true;
            }
            await carregarProvas();
        }
        
        function renderizarListaProvas() {
            const container = document.getElementById('listaProvas');
            if (provas.length === 0) {
                container.innerHTML = '<div style="text-align:center;padding:20px;color:#aaa;">Nenhuma prova criada</div>';
                return;
            }
            container.innerHTML = provas.map(p => `
                <div class="prova-item" data-id="${p.id}">
                    <div class="prova-info">
                        <div class="prova-nome">${p.nome_prova}</div>
                        <div class="prova-detalhes">${p.num_questoes} questões</div>
                    </div>
                    <div class="prova-acoes">
                        <button class="btn-edit" data-id="${p.id}">✏️</button>
                        <button class="btn-del" data-id="${p.id}">🗑️</button>
                    </div>
                </div>
            `).join('');
            
            document.querySelectorAll('.prova-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (!e.target.closest('.prova-acoes')) {
                        selecionarProva(el.dataset.id);
                        document.getElementById('modalProvas').style.display = 'none';
                    }
                });
            });
            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const p = provas.find(x => x.id == btn.dataset.id);
                    if (p) {
                        document.getElementById('provaNome').value = p.nome_prova;
                        document.getElementById('provaNumQuestoes').value = p.num_questoes;
                        document.getElementById('provaNumOpcoes').value = p.opcoes_por_questao || 4;
                        document.getElementById('modalTitulo').textContent = '✏️ Editar Prova';
                        document.getElementById('modalEditar').dataset.editId = p.id;
                        document.getElementById('modalEditar').style.display = 'block';
                        document.getElementById('modalProvas').style.display = 'none';
                    }
                });
            });
            document.querySelectorAll('.btn-del').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    excluirProva(btn.dataset.id);
                });
            });
        }
        
        function renderizarGabarito() {
            const container = document.getElementById('gabaritoGrid');
            container.innerHTML = '';
            for (let i = 0; i < NUM_QUESTOES; i++) {
                const div = document.createElement('div');
                div.className = 'gab-item';
                div.innerHTML = `<label>Q${i+1}</label>
                    <select data-q="${i}">
                        ${opcoesAtuais.map(op => `<option value="${op}" ${gabarito[i] === op ? 'selected' : ''}>${op}</option>`).join('')}
                    </select>`;
                container.appendChild(div);
            }
            document.querySelectorAll('#gabaritoGrid select').forEach(el => {
                el.addEventListener('change', () => {
                    gabarito[parseInt(el.dataset.q)] = el.value;
                });
            });
        }
        
        // ========== CÂMERA E DETECÇÃO ==========
        async function iniciarCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1080 }, height: { ideal: 1920 } }
                });
                video.srcObject = stream;
                await video.play();
                statusEl.textContent = '🟡 Posicione a folha';
                document.getElementById('btnPreview').disabled = false;
            } catch(e) {
                statusEl.textContent = '❌ Erro na câmera';
                statusEl.className = 'status error';
            }
        }
        
        function detectarQuadrados(imageData, w, h) {
            const dados = imageData.data;
            const limiar = limiarDetecao;
            const pontos = [];
            const step = 2;
            
            for (let y = 0; y < h - step; y += step) {
                for (let x = 0; x < w - step; x += step) {
                    const idx = (y * w + x) * 4;
                    const brilho = (dados[idx] + dados[idx+1] + dados[idx+2]) / 3;
                    if (brilho < limiar) pontos.push({x, y});
                }
            }
            if (pontos.length < 20) return null;
            
            const raio = Math.min(w, h) * 0.025;
            const grupos = [];
            for (const p of pontos) {
                let encontrado = false;
                for (const g of grupos) {
                    const dx = p.x - g.cx, dy = p.y - g.cy;
                    if (dx*dx + dy*dy < raio*raio) {
                        g.cx = (g.cx * g.count + p.x) / (g.count + 1);
                        g.cy = (g.cy * g.count + p.y) / (g.count + 1);
                        g.count++;
                        encontrado = true;
                        break;
                    }
                }
                if (!encontrado) grupos.push({cx: p.x, cy: p.y, count: 1});
            }
            
            const filtrados = grupos.filter(g => g.count > 10);
            const quadrados = [];
            const minT = Math.min(w, h) * 0.018;
            const maxT = Math.min(w, h) * 0.08;
            
            for (const g of filtrados) {
                const cx = Math.round(g.cx), cy = Math.round(g.cy);
                let esq = cx, dir = cx, top = cy, bot = cy;
                
                for (let x = cx-1; x>=0; x--) {
                    const idx = (cy*w + x)*4;
                    const brilho = (dados[idx]+dados[idx+1]+dados[idx+2])/3;
                    if (brilho < limiar) esq = x; else break;
                }
                for (let x = cx+1; x<w; x++) {
                    const idx = (cy*w + x)*4;
                    const brilho = (dados[idx]+dados[idx+1]+dados[idx+2])/3;
                    if (brilho < limiar) dir = x; else break;
                }
                for (let y = cy-1; y>=0; y--) {
                    const idx = (y*w + cx)*4;
                    const brilho = (dados[idx]+dados[idx+1]+dados[idx+2])/3;
                    if (brilho < limiar) top = y; else break;
                }
                for (let y = cy+1; y<h; y++) {
                    const idx = (y*w + cx)*4;
                    const brilho = (dados[idx]+dados[idx+1]+dados[idx+2])/3;
                    if (brilho < limiar) bot = y; else break;
                }
                
                const larg = dir - esq + 1, alt = bot - top + 1;
                if (larg > minT && larg < maxT && alt > minT && alt < maxT) {
                    const prop = Math.min(larg, alt) / Math.max(larg, alt);
                    if (prop > 0.6) {
                        quadrados.push({x: (esq+dir)/2, y: (top+bot)/2, esq, dir, top, bot, larg, alt});
                    }
                }
            }
            
            if (quadrados.length < 4) return null;
            
            quadrados.sort((a,b) => a.y - b.y);
            const meta = Math.floor(quadrados.length/2);
            const sup = quadrados.slice(0, meta);
            const inf = quadrados.slice(meta);
            sup.sort((a,b) => a.x - b.x);
            inf.sort((a,b) => a.x - b.x);
            if (sup.length < 2 || inf.length < 2) return null;
            
            return {
                se: sup[0], sd: sup[sup.length-1],
                ie: inf[0], id: inf[inf.length-1]
            };
        }
        
        function mediaQuadrados(hist) {
            if (hist.length === 0) return null;
            const keys = ['se','sd','ie','id'];
            const media = {};
            for (const k of keys) {
                media[k] = {x:0, y:0, esq:0, top:0, dir:0, bot:0};
                for (const item of hist) {
                    media[k].x += item[k].x;
                    media[k].y += item[k].y;
                    media[k].esq += item[k].esq;
                    media[k].top += item[k].top;
                    media[k].dir += item[k].dir;
                    media[k].bot += item[k].bot;
                }
                media[k].x /= hist.length;
                media[k].y /= hist.length;
                media[k].esq /= hist.length;
                media[k].top /= hist.length;
                media[k].dir /= hist.length;
                media[k].bot /= hist.length;
            }
            return media;
        }
        
        function processarFrame() {
            if (!provaAtual || !video.videoWidth) return;
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            const tCtx = tempCanvas.getContext('2d');
            tCtx.drawImage(video, 0, 0);
            
            const targetW = 1200;
            const scale = targetW / tempCanvas.width;
            const targetH = Math.floor(tempCanvas.height * scale);
            
            const c = document.createElement('canvas');
            c.width = targetW;
            c.height = targetH;
            const ctx = c.getContext('2d');
            ctx.drawImage(tempCanvas, 0, 0, targetW, targetH);
            
            canvas.width = targetW;
            canvas.height = targetH;
            const overlay = canvas.getContext('2d');
            
            const imageData = ctx.getImageData(0, 0, targetW, targetH);
            
            overlay.clearRect(0, 0, targetW, targetH);
            overlay.globalAlpha = 0.85;
            
            const quad = detectarQuadrados(imageData, targetW, targetH);
            
            if (quad) {
                // Histórico
                historicoQuadrados.push(quad);
                if (historicoQuadrados.length > MAX_HIST) historicoQuadrados.shift();
                
                // Estabilidade
                if (historicoQuadrados.length >= framesParaEstabilizar) {
                    const p = historicoQuadrados[0], u = historicoQuadrados[historicoQuadrados.length-1];
                    const dx = Math.abs(p.se.x - u.se.x);
                    const dy = Math.abs(p.se.y - u.se.y);
                    const limite = Math.min(targetW, targetH) * 0.008;
                    if (dx < limite && dy < limite) framesEstaveis++;
                    else framesEstaveis = Math.max(0, framesEstaveis - 1);
                }
                
                let qUsar = quad;
                if (framesEstaveis >= framesParaEstabilizar && historicoQuadrados.length >= framesParaEstabilizar) {
                    const media = mediaQuadrados(historicoQuadrados);
                    if (media) {
                        qUsar = media;
                        gradeEstavel = true;
                        cameraContainer.classList.add('estavel');
                        deteccaoInfo.textContent = `✅ ESTÁVEL! ${framesEstaveis}/${framesParaEstabilizar}`;
                        statusEl.className = 'status estavel';
                        statusEl.textContent = '✅ Estabilizado! Pronto para CAPTURAR';
                    }
                } else {
                    gradeEstavel = false;
                    cameraContainer.classList.remove('estavel');
                    deteccaoInfo.textContent = `🔄 Estabilizando... ${framesEstaveis}/${framesParaEstabilizar}`;
                    statusEl.className = 'status detected';
                    statusEl.textContent = '🔄 Aguardando estabilização...';
                }
                
                // Desenha quadrados azuis
                const arr = [qUsar.se, qUsar.sd, qUsar.ie, qUsar.id];
                for (const q of arr) {
                    overlay.strokeStyle = '#00ccff';
                    overlay.lineWidth = 3;
                    overlay.strokeRect(q.esq, q.top, q.dir - q.esq, q.bot - q.top);
                    overlay.fillStyle = '#00ccff';
                    overlay.beginPath();
                    overlay.arc(q.x, q.y, 5, 0, 2*Math.PI);
                    overlay.fill();
                }
                
                // Área da grade
                const topY = Math.min(qUsar.se.top, qUsar.sd.top);
                const botY = Math.max(qUsar.ie.bot, qUsar.id.bot);
                const leftX = Math.min(qUsar.se.esq, qUsar.ie.esq);
                const rightX = Math.max(qUsar.sd.dir, qUsar.id.dir);
                
                const marg = margem;
                const largT = rightX - leftX;
                const altT = botY - topY;
                const zoom = zoomGrade;
                const cx = (leftX + rightX)/2 + (ajusteX * targetW);
                const cy = (topY + botY)/2 + (ajusteY * targetH);
                const largZ = largT * zoom;
                const altZ = altT * zoom;
                
                const areaE = cx - largZ/2 + largZ*marg;
                const areaD = cx + largZ/2 - largZ*marg;
                const areaT = cy - altZ/2 + altZ*marg;
                const areaB = cy + altZ/2 - altZ*marg;
                
                // Grade vermelha
                overlay.strokeStyle = '#ff0000';
                overlay.lineWidth = 3;
                overlay.strokeRect(areaE, areaT, areaD - areaE, areaB - areaT);
                
                overlay.strokeStyle = '#ff6666';
                overlay.lineWidth = 1;
                const xMeio = areaE + (areaD - areaE)/COLUNAS;
                overlay.beginPath();
                overlay.moveTo(xMeio, areaT);
                overlay.lineTo(xMeio, areaB);
                overlay.stroke();
                
                for (let i = 1; i < LINHAS; i++) {
                    const y = areaT + i * (areaB - areaT)/LINHAS;
                    overlay.beginPath();
                    overlay.moveTo(areaE, y);
                    overlay.lineTo(areaD, y);
                    overlay.stroke();
                }
                
                // Detecção de respostas
                const dados = imageData.data;
                const cellW = (areaD - areaE) / COLUNAS;
                const cellH = (areaB - areaT) / LINHAS;
                const opW = cellW / (numOpcoes + 0.7);
                const raio = Math.min(cellW, cellH) * 0.09;
                const areaNum = cellW * 0.18;
                
                function verifPreench(cx, cy, r) {
                    const rTest = r * 0.65;
                    let totalC = 0, escC = 0;
                    for (let dy = -rTest; dy <= rTest; dy += 1.5) {
                        for (let dx = -rTest; dx <= rTest; dx += 1.5) {
                            if (dx*dx + dy*dy <= rTest*rTest) {
                                totalC++;
                                const px = cx+dx, py = cy+dy;
                                if (px >= 0 && px < targetW && py >= 0 && py < targetH) {
                                    const idx = (Math.floor(py)*targetW + Math.floor(px))*4;
                                    const b = (dados[idx]*0.299 + dados[idx+1]*0.587 + dados[idx+2]*0.114);
                                    if (b < limiarDetecao*1.1) escC++;
                                }
                            }
                        }
                    }
                    let totalB = 0, escB = 0;
                    const rB = r * 0.85;
                    for (let ang = 0; ang < 360; ang += 10) {
                        const rad = ang * Math.PI/180;
                        const px = cx + Math.cos(rad)*rB;
                        const py = cy + Math.sin(rad)*rB;
                        if (px >= 0 && px < targetW && py >= 0 && py < targetH) {
                            totalB++;
                            const idx = (Math.floor(py)*targetW + Math.floor(px))*4;
                            const b = (dados[idx]*0.299 + dados[idx+1]*0.587 + dados[idx+2]*0.114);
                            if (b < limiarDetecao*1.15) escB++;
                        }
                    }
                    const pC = totalC > 0 ? escC/totalC : 0;
                    const pB = totalB > 0 ? escB/totalB : 0;
                    const preench = (pC + pB)/2;
                    const preenchido = preench > sensibilidade && pC > 0.15 && pB > 0.15;
                    return { preench, preenchido };
                }
                
                const respostas = [];
                let detectadas = 0;
                let idxQ = 0;
                
                for (let linha = 0; linha < LINHAS; linha++) {
                    for (let col = 0; col < COLUNAS; col++) {
                        if (idxQ >= NUM_QUESTOES) break;
                        const cellX = areaE + col * cellW;
                        const cellY = areaT + linha * cellH;
                        const numX = cellX + areaNum/2;
                        const numY = cellY + cellH/2;
                        
                        let melhor = -1, maiorP = 0, totalP = 0;
                        
                        for (let opt = 0; opt < numOpcoes; opt++) {
                            const ox = cellX + (opt + 0.6) * opW;
                            const oy = cellY + cellH/2;
                            
                            const distN = Math.sqrt((ox-numX)**2 + (oy-numY)**2);
                            if (distN < areaNum * 0.6) {
                                overlay.beginPath();
                                overlay.arc(ox, oy, raio*0.5, 0, 2*Math.PI);
                                overlay.strokeStyle = '#444';
                                overlay.stroke();
                                continue;
                            }
                            
                            const res = verifPreench(ox, oy, raio);
                            overlay.beginPath();
                            overlay.arc(ox, oy, raio, 0, 2*Math.PI);
                            
                            if (res.preenchido) {
                                const intens = Math.min(res.preench * 1.5, 0.9);
                                overlay.fillStyle = `rgba(0,255,0,${intens})`;
                                overlay.fill();
                                overlay.strokeStyle = '#00ff00';
                                totalP++;
                                if (res.preench > maiorP) {
                                    maiorP = res.preench;
                                    melhor = opt;
                                }
                            } else {
                                overlay.strokeStyle = '#ff8888';
                                if (res.preench > 0.08) {
                                    overlay.fillStyle = `rgba(255,255,0,${res.preench*0.15})`;
                                    overlay.fill();
                                }
                            }
                            overlay.stroke();
                        }
                        
                        const num = idxQ + 1;
                        overlay.font = `bold ${Math.max(10, raio+3)}px Arial`;
                        overlay.fillStyle = '#ffff00';
                        overlay.textAlign = 'left';
                        overlay.textBaseline = 'top';
                        overlay.fillText(`${num}`, cellX + 3, cellY + 3);
                        
                        if (totalP === 1 && melhor >= 0) {
                            respostas.push(opcoesAtuais[melhor]);
                            detectadas++;
                            overlay.fillStyle = 'rgba(0,255,0,0.07)';
                            overlay.fillRect(cellX, cellY, cellW, cellH);
                        } else if (totalP > 1) {
                            respostas.push(null);
                            overlay.fillStyle = 'rgba(255,255,0,0.07)';
                            overlay.fillRect(cellX, cellY, cellW, cellH);
                        } else {
                            respostas.push(null);
                            overlay.fillStyle = 'rgba(255,0,0,0.03)';
                            overlay.fillRect(cellX, cellY, cellW, cellH);
                        }
                        idxQ++;
                    }
                    if (idxQ >= NUM_QUESTOES) break;
                }
                
                // Resultados
                let acertos = 0;
                const detalhes = [];
                for (let i = 0; i < NUM_QUESTOES; i++) {
                    const aluno = respostas[i] || '⚪';
                    const correto = gabarito[i] || '?';
                    const certo = aluno === correto;
                    if (certo) acertos++;
                    detalhes.push({num: i+1, aluno, certo});
                }
                
                const nota = (acertos / NUM_QUESTOES) * 10;
                const resultado = { acertos, total: NUM_QUESTOES, nota, detalhes, detectadas };
                
                ultimaDeteccao = { quadrados: qUsar, resultado };
                
                resultadoEl.style.display = 'block';
                notaEl.textContent = `🎓 NOTA: ${nota.toFixed(1)} (${acertos}/${NUM_QUESTOES})`;
                gridEl.innerHTML = detalhes.map(d => `
                    <div class="item ${d.aluno === '⚪' ? 'vazio' : (d.certo ? 'certa' : 'errada')}">
                        ${d.num}<br>${d.aluno}
                    </div>
                `).join('');
                
                if (gradeEstavel && detectadas > NUM_QUESTOES * 0.7) {
                    statusEl.textContent = `✅ ${detectadas}/${NUM_QUESTOES} - Pronto para CAPTURAR`;
                    statusEl.className = 'status good';
                } else if (detectadas > NUM_QUESTOES * 0.4) {
                    statusEl.textContent = `🟡 ${detectadas}/${NUM_QUESTOES} - Aguardando estabilização`;
                    statusEl.className = 'status detected';
                } else {
                    statusEl.textContent = `🔴 ${detectadas}/${NUM_QUESTOES} - Verifique a folha`;
                    statusEl.className = 'status error';
                }
                
            } else {
                gradeEstavel = false;
                framesEstaveis = 0;
                historicoQuadrados = [];
                cameraContainer.classList.remove('estavel');
                deteccaoInfo.textContent = '🔴 Quadrados não detectados. Posicione a folha.';
                statusEl.className = 'status error';
                statusEl.textContent = '🔴 Posicione a folha';
                ultimaDeteccao = null;
            }
        }
        
        // ========== CONTROLES ==========
        document.getElementById('btnCapturar').addEventListener('click', () => {
            if (!provaAtual) { alert('Selecione uma prova!'); return; }
            if (capturado) { resetarCaptura(); return; }
            if (ultimaDeteccao && ultimaDeteccao.quadrados && gradeEstavel) {
                capturado = true;
                resultadoCapturado = ultimaDeteccao.resultado;
                cameraContainer.classList.add('capturado');
                badge.classList.add('visible');
                document.getElementById('btnCapturar').textContent = '🔄 RECAPTURAR';
                document.getElementById('btnCapturar').classList.add('capturado');
                resultadoEl.classList.add('capturado');
                statusEl.className = 'status capturado';
                statusEl.textContent = '✅ CAPTURADO!';
                deteccaoInfo.textContent = '✅ CAPTURADO! Resultados finais.';
                pararLeitura();
            } else {
                alert('⚠️ Aguarde a estabilização da grade.');
            }
        });
        
        document.getElementById('btnPreview').addEventListener('click', () => {
            if (leituraAtiva) { pararLeitura(); }
            else { iniciarLeitura(); }
        });
        
        document.getElementById('btnProvas').addEventListener('click', () => {
            renderizarListaProvas();
            document.getElementById('modalProvas').style.display = 'block';
        });
        
        document.getElementById('btnNovaProva').addEventListener('click', () => {
            document.getElementById('provaNome').value = '';
            document.getElementById('provaNumQuestoes').value = 40;
            document.getElementById('provaNumOpcoes').value = 4;
            document.getElementById('modalTitulo').textContent = '📝 Criar Prova';
            delete document.getElementById('modalEditar').dataset.editId;
            document.getElementById('modalEditar').style.display = 'block';
            document.getElementById('modalProvas').style.display = 'none';
        });
        
        document.getElementById('btnSalvarProva').addEventListener('click', async () => {
            const nome = document.getElementById('provaNome').value.trim();
            const numQ = parseInt(document.getElementById('provaNumQuestoes').value);
            const numOps = parseInt(document.getElementById('provaNumOpcoes').value);
            if (!nome) { alert('Digite um nome!'); return; }
            const editId = document.getElementById('modalEditar').dataset.editId;
            await salvarProva(nome, numQ, numOps, editId);
            document.getElementById('modalEditar').style.display = 'none';
            alert(`✅ Prova "${nome}" salva!`);
            resetarCaptura();
            resetarEstabilizacao();
        });
        
        document.getElementById('btnFecharProvas').addEventListener('click', () => {
            document.getElementById('modalProvas').style.display = 'none';
        });
        
        document.getElementById('btnCancelarEditar').addEventListener('click', () => {
            document.getElementById('modalEditar').style.display = 'none';
        });
        
        document.getElementById('btnGabarito').addEventListener('click', () => {
            if (!provaAtual) { alert('Selecione uma prova!'); return; }
            renderizarGabarito();
            document.getElementById('modalGabarito').style.display = 'block';
        });
        
        document.getElementById('btnSalvarGabarito').addEventListener('click', async () => {
            if (!provaAtual) return;
            await supabase.from('provas').update({ gabarito }).eq('id', provaAtual.id);
            alert('✅ Gabarito salvo!');
            document.getElementById('modalGabarito').style.display = 'none';
        });
        
        document.getElementById('btnFecharGabarito').addEventListener('click', () => {
            document.getElementById('modalGabarito').style.display = 'none';
        });
        
        document.getElementById('btnResetGabarito').addEventListener('click', () => {
            if (confirm('Resetar gabarito para a primeira opção?')) {
                gabarito = new Array(NUM_QUESTOES).fill(opcoesAtuais[0]);
                renderizarGabarito();
            }
        });
        
        document.getElementById('btnSair').addEventListener('click', () => {
            pararLeitura();
            if (stream) stream.getTracks().forEach(t => t.stop());
            localStorage.clear();
            window.location.href = 'index.html';
        });
        
        document.querySelectorAll('.modal').forEach(m => {
            m.addEventListener('click', (e) => { if (e.target === m) m.style.display = 'none'; });
        });
        
        function iniciarLeitura() {
            if (capturado) return;
            if (frameInterval) clearInterval(frameInterval);
            leituraAtiva = true;
            document.getElementById('btnPreview').textContent = '⏹️ Parar';
            document.getElementById('btnPreview').classList.add('ativo');
            frameInterval = setInterval(processarFrame, 300);
        }
        
        function pararLeitura() {
            if (frameInterval) clearInterval(frameInterval);
            leituraAtiva = false;
            document.getElementById('btnPreview').textContent = '🎯 Prévia';
            document.getElementById('btnPreview').classList.remove('ativo');
            if (!capturado) {
                const ctx = canvas.getContext('2d');
                if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        }
        
        // ========== INICIALIZAÇÃO ==========
        async function iniciar() {
            await carregarProvas();
            await iniciarCamera();
            // Inicia a prévia automaticamente
            setTimeout(() => {
                if (!leituraAtiva && provaAtual) {
                    iniciarLeitura();
                }
            }, 1000);
        }
        
        iniciar();
    </script>
