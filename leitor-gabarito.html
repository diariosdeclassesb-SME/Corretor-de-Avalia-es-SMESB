<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor Básico</title>
    <style>
        body { background: #000; color: #fff; font-family: Arial; padding: 10px; }
        video { width: 100%; border-radius: 10px; background: #111; }
        canvas { display: none; }
        .info { background: #222; padding: 10px; border-radius: 10px; margin: 5px 0; }
        button { 
            background: #1a73e8; color: white; border: none; 
            padding: 15px; border-radius: 10px; font-size: 16px;
            width: 100%; margin: 5px 0; font-weight: bold;
        }
        button:active { transform: scale(0.95); }
        .resultado { background: #1a1a1a; padding: 10px; border-radius: 10px; margin-top: 10px; display: none; }
        .nota { font-size: 24px; color: #4caf50; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; max-height: 150px; overflow-y: auto; }
        .item { padding: 2px; border-radius: 3px; text-align: center; font-size: 10px; }
        .certa { background: #1b5e1b; }
        .errada { background: #8b1a1a; }
        .vazio { background: #444; }
    </style>
</head>
<body>
    <h1>📸 Leitor Básico</h1>
    <div class="info" id="status">🟡 Aguardando...</div>
    
    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
    
    <button id="btnCorrigir">📸 CORRIGIR</button>
    
    <div class="resultado" id="resultado">
        <div class="nota" id="nota">NOTA: -</div>
        <div class="grid" id="grid"></div>
    </div>

    <script>
        // ========== CONFIGURAÇÃO ==========
        // Use o Excel para gerar o gabarito
        // Coloque as respostas corretas aqui (A, B, C, D)
        const GABARITO = [
            'A','B','C','D','A','B','C','D','A','B',
            'C','D','A','B','C','D','A','B','C','D',
            'A','B','C','D','A','B','C','D','A','B',
            'C','D','A','B','C','D','A','B','C','D'
        ];
        
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const resultado = document.getElementById('resultado');
        const notaDiv = document.getElementById('nota');
        const gridDiv = document.getElementById('grid');
        
        let stream = null;
        let corrigindo = false;
        
        // Iniciar câmera
        async function iniciarCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                await video.play();
                status.innerHTML = '🟡 Posicione a folha e clique em CORRIGIR';
            } catch(e) {
                status.innerHTML = '❌ Erro na câmera: ' + e.message;
            }
        }
        
        // Capturar e analisar
        function capturar() {
            if (!video.videoWidth) {
                alert('Aguarde a câmera iniciar');
                return;
            }
            
            corrigindo = true;
            status.innerHTML = '📷 Analisando...';
            
            // Captura o frame
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0);
            
            // Reduz para processar
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const dados = imgData.data;
            
            // Área de detecção (centro da imagem)
            const w = canvas.width;
            const h = canvas.height;
            
            // Posição da grade - você precisa ajustar estas coordenadas
            // para sua folha específica
            const xInicio = w * 0.15;
            const xFim = w * 0.85;
            const yInicio = h * 0.25;
            const yFim = h * 0.85;
            
            const colunas = 2;
            const linhas = 20;
            const cellW = (xFim - xInicio) / colunas;
            const cellH = (yFim - yInicio) / linhas;
            
            // Opções por questão (4)
            const opcoes = ['A', 'B', 'C', 'D'];
            const opcaoW = cellW / (opcoes.length + 0.5);
            const raio = Math.min(cellW, cellH) * 0.08;
            
            let respostas = [];
            let detectadas = 0;
            
            // Para cada questão
            for (let linha = 0; linha < linhas; linha++) {
                for (let col = 0; col < colunas; col++) {
                    const idx = linha * colunas + col;
                    if (idx >= GABARITO.length) break;
                    
                    const cellX = xInicio + col * cellW;
                    const cellY = yInicio + linha * cellH;
                    
                    let melhorOpcao = -1;
                    let maiorPreenchimento = 0;
                    let totalPreenchidas = 0;
                    
                    // Verifica cada opção
                    for (let opt = 0; opt < opcoes.length; opt++) {
                        const ox = cellX + (opt + 0.6) * opcaoW;
                        const oy = cellY + cellH / 2;
                        
                        // Conta pixels escuros no círculo
                        let escuros = 0;
                        let total = 0;
                        for (let dy = -raio; dy <= raio; dy += 1.5) {
                            for (let dx = -raio; dx <= raio; dx += 1.5) {
                                if (dx*dx + dy*dy <= raio*raio) {
                                    total++;
                                    const px = Math.floor(ox + dx);
                                    const py = Math.floor(oy + dy);
                                    if (px >= 0 && px < w && py >= 0 && py < h) {
                                        const idx2 = (py * w + px) * 4;
                                        const brilho = (dados[idx2] + dados[idx2+1] + dados[idx2+2]) / 3;
                                        if (brilho < 80) escuros++;
                                    }
                                }
                            }
                        }
                        
                        const pct = total > 0 ? escuros / total : 0;
                        
                        if (pct > 0.18) {
                            totalPreenchidas++;
                            if (pct > maiorPreenchimento) {
                                maiorPreenchimento = pct;
                                melhorOpcao = opt;
                            }
                        }
                    }
                    
                    if (totalPreenchidas === 1 && melhorOpcao >= 0) {
                        respostas.push(opcoes[melhorOpcao]);
                        detectadas++;
                    } else {
                        respostas.push(null);
                    }
                }
            }
            
            // Calcula resultado
            let acertos = 0;
            const detalhes = [];
            for (let i = 0; i < GABARITO.length; i++) {
                const aluno = respostas[i] || '⚪';
                const correto = GABARITO[i];
                if (aluno === correto) acertos++;
                detalhes.push({
                    num: i+1,
                    aluno: aluno,
                    certo: aluno === correto
                });
            }
            
            const nota = (acertos / GABARITO.length) * 10;
            
            // Mostra resultado
            resultado.style.display = 'block';
            notaDiv.textContent = `🎓 NOTA: ${nota.toFixed(1)} (${acertos}/${GABARITO.length})`;
            
            gridDiv.innerHTML = detalhes.map(d => `
                <div class="item ${d.aluno === '⚪' ? 'vazio' : (d.certo ? 'certa' : 'errada')}">
                    ${d.num}<br>${d.aluno}
                </div>
            `).join('');
            
            status.innerHTML = `✅ ${detectadas}/${GABARITO.length} detectadas | NOTA: ${nota.toFixed(1)}`;
            corrigindo = false;
        }
        
        // Eventos
        document.getElementById('btnCorrigir').addEventListener('click', () => {
            if (!corrigindo) capturar();
        });
        
        // Iniciar
        iniciarCamera();
    </script>
</body>
</html>
