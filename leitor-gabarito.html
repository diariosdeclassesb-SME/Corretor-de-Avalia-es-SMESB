        .alignment-overlay {

        .marker-dot {
            position: absolute;
            width: 16px;
            height: 16px;

        .marker-dot.quadrado {
            background: #ff6600;
            width: 20px;
            height: 20px;

        }
        
        .guide-box {

        // ========== FUNÇÃO PARA DETECTAR APENAS QUADRADOS GRANDES ==========
        function detectarQuadradosAlinhamento(ctx, width, height) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            
            const quadrados = [];
            const visitado = new Array(width * height).fill(false);
            
            function encontrarRegiao(startX, startY) {
                const pixels = [];
                const queue = [{x: startX, y: startY}];
                let minX = startX, maxX = startX, minY = startY, maxY = startY;
                
                while (queue.length > 0) {
                    const {x, y} = queue.shift();
                    const idx = y * width + x;
                    
                    if (x < 0 || x >= width || y < 0 || y >= height) continue;
                    if (visitado[idx]) continue;
                    
                    const pixelIdx = idx * 4;
                    const brilho = (data[pixelIdx] + data[pixelIdx+1] + data[pixelIdx+2]) / 3;
                    
                    // Quadrados de alinhamento são bem escuros (brilho < 50)
                    if (brilho > 60) continue;
                    
                    visitado[idx] = true;
                    pixels.push({x, y});
                    minX = Math.min(minX, x);
                    maxX = Math.max(maxX, x);
                    minY = Math.min(minY, y);
                    maxY = Math.max(maxY, y);
                    
                    queue.push({x: x+1, y});
                    queue.push({x: x-1, y});
                    queue.push({x, y: y+1});
                    queue.push({x, y: y-1});
                }
                
                // Quadrados de alinhamento têm pelo menos 100 pixels
                if (pixels.length < 80) return null;
                
                const largura = maxX - minX;
                const altura = maxY - minY;
                const area = pixels.length;
                const areaEsperada = largura * altura;
                const proporcaoPreenchida = area / areaEsperada;
                const proporcaoLados = Math.max(largura, altura) / Math.min(largura, altura);
                
                // Verifica se é um quadrado (proporção próxima de 1)
                if (proporcaoLados < 1.8 && proporcaoPreenchida > 0.4 && largura > 15 && altura > 15) {
                    return {
                        x: (minX + maxX) / 2,
                        y: (minY + maxY) / 2,
                        width: largura,
                        height: altura,
                        minX, minY, maxX, maxY,
                        area: pixels.length
                    };
                }
                
                return null;
            }
            
            // Varre a imagem procurando regiões escuras
            for (let y = 0; y < height; y += 20) {
                for (let x = 0; x < width; x += 20) {
                    const idx = y * width + x;
                    if (!visitado[idx]) {
                        const pixelIdx = idx * 4;
                        const brilho = (data[pixelIdx] + data[pixelIdx+1] + data[pixelIdx+2]) / 3;
                        if (brilho < 55) {
                            const quadrado = encontrarRegiao(x, y);
                            if (quadrado) {
                                quadrados.push(quadrado);
                            }
                        }
                    }
                }
            }
            
            // Filtra por tamanho (quadrados de alinhamento são maiores que os círculos)
            const tamanhoMedio = quadrados.reduce((sum, q) => sum + q.area, 0) / (quadrados.length || 1);
            const quadradosGrandes = quadrados.filter(q => q.area > tamanhoMedio * 0.5);
            
            // Ordena por posição
            quadradosGrandes.sort((a, b) => {
                if (Math.abs(a.y - b.y) < 50) return a.x - b.x;
                return a.y - b.y;
            });
            
            return quadradosGrandes;
        }
        
        // ========== FUNÇÕES SUPABASE ==========
        async function garantirUsuarioExistente() {
            const { data: existe } = await supabaseClient

            try {
                const { data, error } = await supabaseClient
                    .from('provas')
                    .select('*')
                    .eq('usuario_id', usuarioId)
                    .order('criado_em', { ascending: false });
                
                if (error) throw error;
                
                provas = data || [];
                renderizarListaProvas();
                
                if (provas.length === 0) {
                    document.getElementById('infoProva').innerHTML = '📋 Nenhuma prova criada';

                    await selecionarProva(provas[0].id);
                }
            } catch (err) {
                console.error('Erro ao carregar provas:', err);
            }
        }

                    .single();
                
                if (error) throw error;
                
                provaAtual = data;
                NUM_QUESTOES = data.num_questoes;
                NUM_OPCOES = data.opcoes_por_questao;
                OPCOES = Array(NUM_OPCOES).fill().map((_, i) => String.fromCharCode(65 + i));
                gabarito = [...data.gabarito];
                
                document.getElementById('infoProva').innerHTML = `📋 ${provaAtual.nome_prova} (${NUM_QUESTOES} questões | ${NUM_OPCOES} opções)`;
                document.getElementById('infoGabarito').innerHTML = `✅ Gabarito carregado!`;
                document.getElementById('infoGabarito').className = 'info-gabarito carregado';
                document.getElementById('btnAbrirGabarito').disabled = false;
                
                document.getElementById('modalProvas').style.display = 'none';

        async function salvarProva(nome, numQuestoes, numOpcoes, editId = null) {
            const opcoes = Array(numOpcoes).fill().map((_, i) => String.fromCharCode(65 + i));
            const novoGabarito = new Array(numQuestoes).fill(opcoes[0]);
            
            if (editId) {
                await supabaseClient
                    .from('provas')
                    .update({
                        nome_prova: nome,
                        num_questoes: numQuestoes,
                        opcoes_por_questao: numOpcoes,
                        gabarito: novoGabarito
                    })
                    .eq('id', editId);
            } else {
                await supabaseClient
                    .from('provas')
                    .insert([{
                        usuario_id: usuarioId,
                        nome_prova: nome,
                        num_questoes: numQuestoes,
                        opcoes_por_questao: numOpcoes,
                        gabarito: novoGabarito
                    }]);
            }
            
            await carregarProvasDoSupabase();
        }
        
        async function excluirProva(provaId) {
            if (!confirm('Tem certeza que deseja excluir esta prova?')) return;
            
            await supabaseClient
                .from('provas')
                .delete()
                .eq('id', provaId);
            
            if (provaAtual && provaAtual.id === provaId) {
                provaAtual = null;
                document.getElementById('infoProva').innerHTML = '📋 Nenhuma prova selecionada';
                document.getElementById('infoGabarito').innerHTML = '⚠️ Selecione ou crie uma prova';
                document.getElementById('btnAbrirGabarito').disabled = true;
                document.getElementById('btnCorrigir').disabled = true;
            }
            
            await carregarProvasDoSupabase();
        }
        
        async function salvarGabaritoProvaAtual() {
            if (!provaAtual) return;
            
            const { error } = await supabaseClient
                .from('provas')
                .update({ gabarito: gabarito })
                .eq('id', provaAtual.id);
            
            if (error) {
                alert('Erro ao salvar gabarito: ' + error.message);
            } else {
                alert('✅ Gabarito salvo com sucesso!');
                document.getElementById('modalGabarito').style.display = 'none';
            }
        }
        
        async function salvarCorrecao(acertos, nota, respostasAluno) {
            if (!provaAtual) return;
            
            let imagemBase64 = null;
            if (imagemCapturada) {
                imagemBase64 = imagemCapturada.toDataURL('image/jpeg', 0.5);
            }
            
            await supabaseClient
                .from('correcoes')
                .insert([{
                    prova_id: provaAtual.id,
                    usuario_id: usuarioId,
                    respostas_aluno: respostasAluno,
                    acertos: acertos,
                    nota: nota,
                    imagem_base64: imagemBase64,
                    data_correcao: new Date().toISOString()
                }]);
        }
        
        function renderizarListaProvas() {
            const container = document.getElementById('listaProvas');
            
            if (provas.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:#aaa;">Nenhuma prova criada ainda</div>';
                return;
            }
            
            container.innerHTML = provas.map(prova => `
                <div class="prova-item" data-id="${prova.id}">
                    <div class="prova-info">
                        <div class="prova-nome">${prova.nome_prova}</div>
                        <div class="prova-detalhes">${prova.num_questoes} questões | ${prova.opcoes_por_questao} opções</div>
                    </div>
                    <div class="prova-acoes">
                        <button class="btn-editar-prova" data-id="${prova.id}">✏️</button>
                        <button class="btn-excluir-prova" data-id="${prova.id}">🗑️</button>
                    </div>
                </div>
            `).join('');
            
            document.querySelectorAll('.prova-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('btn-editar-prova') && !e.target.classList.contains('btn-excluir-prova')) {
                        selecionarProva(item.dataset.id);
                    }
                });
            });
            
            document.querySelectorAll('.btn-editar-prova').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    const prova = provas.find(p => p.id == id);
                    if (prova) {
                        document.getElementById('provaNome').value = prova.nome_prova;
                        document.getElementById('provaNumQuestoes').value = prova.num_questoes;
                        document.getElementById('provaNumOpcoes').value = prova.opcoes_por_questao;
                        document.getElementById('modalEditarTitulo').innerHTML = '✏️ Editar Prova';
                        document.getElementById('modalEditarProva').dataset.editId = id;
                        document.getElementById('modalEditarProva').style.display = 'block';
                        document.getElementById('modalProvas').style.display = 'none';
                    }
                });
            });
            
            document.querySelectorAll('.btn-excluir-prova').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    await excluirProva(id);
                });
            });
        }
        
        function renderizarModalGabarito() {
            const container = document.getElementById('gabaritoLista');
            container.innerHTML = '';
            
            for (let i = 0; i < NUM_QUESTOES; i++) {
                const div = document.createElement('div');
                div.className = 'gab-item';
                div.innerHTML = `
                    <label>Q${i+1}</label>
                    <select id="gabSelect_${i}" data-questao="${i}">
                        ${OPCOES.map(op => `<option value="${op}" ${gabarito[i] === op ? 'selected' : ''}>${op}</option>`).join('')}
                    </select>
                `;
                container.appendChild(div);
            }
            
            for (let i = 0; i < NUM_QUESTOES; i++) {
                const select = document.getElementById(`gabSelect_${i}`);
                if (select) {
                    select.addEventListener('change', (e) => {
                        const questao = parseInt(e.target.dataset.questao);
                        gabarito[questao] = e.target.value;
                    });
                }
            }
        }
        
        // ========== CÂMERA E ALINHAMENTO ==========
        async function iniciarCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            
            statusAlinhamento.innerHTML = '📷 Solicitando câmera...';
            
            try {
                const constraints = {
                    video: {
                        facingMode: { exact: "environment" },
                        width: { ideal: 1080 },
                        height: { ideal: 1920 }
                    }
                };
                
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });
                
                statusAlinhamento.innerHTML = '🟡 Posicione a folha para detectar os 6 quadrados pretos';
                document.getElementById('btnCapturar').disabled = false;
                iniciarDeteccaoQuadrados();
                
            } catch (err) {
                console.error('Erro câmera:', err);
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                    await video.play();
                    statusAlinhamento.innerHTML = '🟡 Posicione a folha';
                    document.getElementById('btnCapturar').disabled = false;
                    iniciarDeteccaoQuadrados();
                } catch (fallbackErr) {
                    statusAlinhamento.innerHTML = '❌ Não foi possível acessar a câmera';
                    statusAlinhamento.className = 'status-alinhamento bad';
                }
            }
        }
        
        function iniciarDeteccaoQuadrados() {
            const canvas = document.getElementById('alignmentCanvas');
            const ctx = canvas.getContext('2d');
            
            function detectar() {
                if (!video.videoWidth || !video.videoHeight) {
                    requestAnimationFrame(detectar);
                    return;
                }
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const quadrados = detectarQuadradosAlinhamento(ctx, canvas.width, canvas.height);
                
                // Limpa overlay
                alignmentOverlay.innerHTML = '';
                
                if (quadrados.length >= 4) {
                    const videoRect = video.getBoundingClientRect();
                    const scaleX = videoRect.width / canvas.width;
                    const scaleY = videoRect.height / canvas.height;
                    
                    // Desenha marcadores laranjas para os quadrados de alinhamento
                    for (const q of quadrados) {
                        const dot = document.createElement('div');
                        dot.className = 'marker-dot quadrado';
                        dot.style.left = `${q.x * scaleX}px`;
                        dot.style.top = `${q.y * scaleY}px`;
                        alignmentOverlay.appendChild(dot);
                    }
                    
                    // Calcula o retângulo que engloba todos os quadrados
                    let minX = Math.min(...quadrados.map(q => q.minX));
                    let maxX = Math.max(...quadrados.map(q => q.maxX));
                    let minY = Math.min(...quadrados.map(q => q.minY));
                    let maxY = Math.max(...quadrados.map(q => q.maxY));
                    
                    const guideDiv = document.createElement('div');
                    guideDiv.className = 'guide-box ' + (quadrados.length >= 5 ? 'aligned' : '');
                    guideDiv.style.left = `${minX * scaleX}px`;
                    guideDiv.style.top = `${minY * scaleY}px`;
                    guideDiv.style.width = `${(maxX - minX) * scaleX}px`;
                    guideDiv.style.height = `${(maxY - minY) * scaleY}px`;
                    guideDiv.style.display = 'block';
                    alignmentOverlay.appendChild(guideDiv);
                    
                    if (quadrados.length >= 5) {
                        quadradosEncontrados = true;
                        quadradosDetectados = quadrados;
                        statusAlinhamento.innerHTML = `✅ ${quadrados.length}/6 quadrados detectados! Pronto para capturar`;
                        statusAlinhamento.className = 'status-alinhamento good';
                    } else {
                        quadradosEncontrados = false;
                        statusAlinhamento.innerHTML = `🟡 ${quadrados.length}/6 quadrados detectados. Ajuste a folha`;
                        statusAlinhamento.className = 'status-alinhamento';
                    }
                } else {
                    quadradosEncontrados = false;
                    statusAlinhamento.innerHTML = `🔴 ${quadrados.length}/6 quadrados detectados. Posicione a folha corretamente`;
                    statusAlinhamento.className = 'status-alinhamento bad';
                }
                
                requestAnimationFrame(detectar);
            }
            
            detectar();
        }
        
        function capturarImagem() {
            if (!quadradosEncontrados) {
                alert('Posicione a folha para detectar os quadrados pretos primeiro!');
                return;
            }
            
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            imagemCapturada = canvas;
            
            const previewImg = document.getElementById('previewImg');
            previewImg.src = canvas.toDataURL('image/jpeg');
            document.getElementById('previewArea').style.display = 'block';
            document.getElementById('btnCorrigir').disabled = false;
            
            statusAlinhamento.innerHTML = '✅ Imagem capturada! Clique em CORRIGIR';
        }
        
        // ========== DETECÇÃO DE RESPOSTAS (ignorando os quadrados) ==========
        function detectarRespostasDaImagem(imgCanvas) {
            console.log('🔍 Iniciando detecção de respostas...');
            
            // Redimensiona
            const targetWidth = 1200;
            const scale = targetWidth / imgCanvas.width;
            const targetHeight = Math.floor(imgCanvas.height * scale);
            
            const canvas = document.createElement('canvas');
            canvas.width = targetWidth;
            canvas.height = targetHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(imgCanvas, 0, 0, targetWidth, targetHeight);
            
            // Melhora contraste
            const imageData = ctx.getImageData(0, 0, targetWidth, targetHeight);
            const data = imageData.data;
            
            // Calcula brilho médio
            let somaBrilho = 0;
            for (let i = 0; i < data.length; i += 4) {
                somaBrilho += (data[i] + data[i+1] + data[i+2]) / 3;
            }
            const brilhoMedio = somaBrilho / (data.length / 4);
            const limiarEscuro = brilhoMedio * 0.55;
            
            for (let i = 0; i < data.length; i += 4) {
                let brilho = (data[i] + data[i+1] + data[i+2]) / 3;
                if (brilho < limiarEscuro) {
                    brilho = Math.max(0, brilho * 0.2);
                } else {
                    brilho = Math.min(255, brilho * 1.5);
                }
                data[i] = data[i+1] = data[i+2] = brilho;
            }
            ctx.putImageData(imageData, 0, 0);
            
            // Calcula grade baseada na quantidade de questões
            const COLUNAS = Math.ceil(Math.sqrt(NUM_QUESTOES));
            const LINHAS = Math.ceil(NUM_QUESTOES / COLUNAS);
            
            const cellWidth = targetWidth / COLUNAS;
            const cellHeight = targetHeight / LINHAS;
            
            // Raio do círculo (bem menor que os quadrados de alinhamento)
            const circleRadius = Math.min(cellWidth, cellHeight) * 0.1;
            const optionsSpacing = cellWidth / (NUM_OPCOES + 1);
            
            const respostas = [];
            let questoesDetectadas = 0;
            const debugMsg = [];
            
            debugMsg.push(`📊 Brilho médio: ${brilhoMedio.toFixed(1)} | Limiar: ${limiarEscuro.toFixed(1)}`);
            debugMsg.push(`📐 Dimensão: ${targetWidth}x${targetHeight}`);
            debugMsg.push(`📋 Grade: ${LINHAS} linhas x ${COLUNAS} colunas`);
            debugMsg.push(`🔘 Raio círculo: ${circleRadius.toFixed(1)}px`);
            
            for (let questao = 0; questao < NUM_QUESTOES; questao++) {
                const linha = Math.floor(questao / COLUNAS);
                const coluna = questao % COLUNAS;
                
                const cellCenterX = (coluna + 0.5) * cellWidth;
                const cellCenterY = (linha + 0.5) * cellHeight;
                
                let melhorOpcao = -1;
                let maiorPreenchimento = 0;
                let opcoesPreenchidas = [];
                
                for (let opt = 0; opt < NUM_OPCOES; opt++) {
                    const circleX = cellCenterX - cellWidth/2 + (opt + 1) * optionsSpacing;
                    const circleY = cellCenterY;
                    
                    let pixelsEscuros = 0;
                    let totalPixels = 0;
                    const raioInt = Math.floor(circleRadius);
                    
                    for (let dy = -raioInt; dy <= raioInt; dy++) {
                        for (let dx = -raioInt; dx <= raioInt; dx++) {
                            if (dx*dx + dy*dy <= circleRadius * circleRadius) {
                                const x = Math.floor(circleX + dx);
                                const y = Math.floor(circleY + dy);
                                
                                if (x >= 0 && x < targetWidth && y >= 0 && y < targetHeight) {
                                    const brilho = data[(y * targetWidth + x) * 4];
                                    totalPixels++;
                                    if (brilho < limiarEscuro) {
                                        pixelsEscuros++;
                                    }
                                }
                            }
                        }
                    }
                    
                    const proporcao = totalPixels > 0 ? pixelsEscuros / totalPixels : 0;
                    
                    if (proporcao > 0.3) {
                        opcoesPreenchidas.push(opt);
                        if (proporcao > maiorPreenchimento) {
                            maiorPreenchimento = proporcao;
                            melhorOpcao = opt;
                        }
                    }
                }
                
                // Só aceita se tiver exatamente UMA opção preenchida
                if (melhorOpcao >= 0 && opcoesPreenchidas.length === 1) {
                    respostas.push(OPCOES[melhorOpcao]);
                    questoesDetectadas++;
                    if (questao < 20) {
                        debugMsg.push(`✅ Q${questao+1}: ${OPCOES[melhorOpcao]} (${(maiorPreenchimento*100).toFixed(0)}%)`);
                    }
                } else {
                    respostas.push(null);
                    if (questao < 20 && opcoesPreenchidas.length > 1) {
                        debugMsg.push(`⚠️ Q${questao+1}: múltiplas opções (${opcoesPreenchidas.length})`);
                    } else if (questao < 20) {
                        debugMsg.push(`❌ Q${questao+1}: nenhuma opção detectada`);
                    }
                }
            }
            
            debugMsg.push(`\n📊 TOTAL DETECTADO: ${questoesDetectadas}/${NUM_QUESTOES} (${(questoesDetectadas/NUM_QUESTOES*100).toFixed(1)}%)`);
            
            const debugDiv = document.getElementById('debugInfo');
            debugDiv.innerHTML = debugMsg.join('<br>');
            debugDiv.style.display = 'block';
            
            return respostas;
        }
        
        // ========== CORREÇÃO ==========
        document.getElementById('btnCorrigir').addEventListener('click', async () => {
            if (!imagemCapturada) {
                alert('Capture uma foto primeiro!');
                return;
            }
            if (!provaAtual) {
                alert('Selecione uma prova primeiro!');
                return;
            }
            
            const btn = document.getElementById('btnCorrigir');
            btn.innerHTML = '🔄 Processando...';
            btn.disabled = true;
            
            setTimeout(async () => {
                try {
                    const respostasAluno = detectarRespostasDaImagem(imagemCapturada);
                    
                    let acertos = 0;
                    let questoesValidas = 0;
                    const detalhes = [];
                    const respostasSalvar = [];
                    
                    for (let i = 0; i < NUM_QUESTOES; i++) {
                        const aluno = respostasAluno[i];
                        const correto = gabarito[i];
                        
                        if (aluno === null) {
                            detalhes.push({ num: i+1, aluno: '○', gabarito: correto, certo: false });
                            respostasSalvar.push(null);
                        } else {
                            questoesValidas++;
                            const certo = (aluno === correto);
                            if (certo) acertos++;
                            detalhes.push({ num: i+1, aluno: aluno, gabarito: correto, certo: certo });
                            respostasSalvar.push(aluno);
                        }
                    }
                    
                    const nota = (acertos / NUM_QUESTOES) * 10;
                    
                    await salvarCorrecao(acertos, nota, respostasSalvar);
                    
                    const panel = document.getElementById('resultadoPanel');
                    panel.style.display = 'block';
                    panel.innerHTML = `
                        <div class="acertos">✅ ${acertos} / ${NUM_QUESTOES}</div>
                        <div class="nota">🎓 NOTA: ${nota.toFixed(1)}</div>
                        <div style="text-align:center; padding:8px; background:#333; border-radius:10px; margin:8px 0;">
                            📊 ${questoesValidas} questões detectadas | ${NUM_QUESTOES - questoesValidas} não preenchidas
                        </div>
                        <div class="detalhes" id="detalhesGrid"></div>
                        <button class="btn-novo" id="btnNovaCorrecao" style="background:#4caf50; margin-top:10px;">📷 Nova Correção</button>
                    `;
                    
                    const grid = document.getElementById('detalhesGrid');
                    grid.innerHTML = detalhes.map(d => `
                        <div class="${d.certo ? 'item-certo' : 'item-errado'}">
                            <strong>${d.num}</strong><br>${d.aluno === '○' ? '⚪' : d.aluno}<br><small>(${d.gabarito})</small>
                        </div>
                    `).join('');
                    
                    document.getElementById('btnNovaCorrecao').addEventListener('click', () => {
                        panel.style.display = 'none';
                        document.getElementById('previewArea').style.display = 'none';
                        imagemCapturada = null;
                        document.getElementById('debugInfo').style.display = 'none';
                        btn.disabled = false;
                    });
                    
                } catch (err) {
                    alert('Erro ao corrigir: ' + err.message);
                }
                
                btn.innerHTML = '🔍 Corrigir Prova';
                btn.disabled = false;
            }, 100);
        });
        
        // ========== EVENTOS ==========
        document.getElementById('btnTentarCamera').addEventListener('click', () => {
            imagemCapturada = null;
            document.getElementById('previewArea').style.display = 'none';
            document.getElementById('resultadoPanel').style.display = 'none';
            document.getElementById('btnCorrigir').disabled = true;
            document.getElementById('debugInfo').style.display = 'none';
            iniciarCamera();
        });
        
        document.getElementById('btnCapturar').addEventListener('click', () => {
            if (!video.videoWidth) return;
            capturarImagem();
        });
        
        document.getElementById('btnGerenciarProvas').addEventListener('click', () => {
            renderizarListaProvas();
            document.getElementById('modalProvas').style.display = 'block';
        });
        
        document.getElementById('btnNovaProva').addEventListener('click', () => {
            document.getElementById('provaNome').value = '';
            document.getElementById('provaNumQuestoes').value = 50;
            document.getElementById('provaNumOpcoes').value = 5;
            document.getElementById('modalEditarTitulo').innerHTML = '📝 Criar Nova Prova';
            delete document.getElementById('modalEditarProva').dataset.editId;
            document.getElementById('modalEditarProva').style.display = 'block';
            document.getElementById('modalProvas').style.display = 'none';
        });
        
        document.getElementById('btnCriarProva').addEventListener('click', async () => {
            const nome = document.getElementById('provaNome').value.trim();
            const numQuestoes = parseInt(document.getElementById('provaNumQuestoes').value);
            const numOpcoes = parseInt(document.getElementById('provaNumOpcoes').value);
            
            if (!nome) { alert('Digite um nome para a prova!'); return; }
            
            const editId = document.getElementById('modalEditarProva').dataset.editId;
            
            const btn = document.getElementById('btnCriarProva');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Salvando...';
            btn.disabled = true;
            
            try {
                await salvarProva(nome, numQuestoes, numOpcoes, editId);
                document.getElementById('modalEditarProva').style.display = 'none';
                alert(`✅ Prova "${nome}" salva com sucesso!`);
            } catch (err) {
                alert('Erro ao salvar prova: ' + err.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
        
        document.getElementById('btnFecharProvas').addEventListener('click', () => {
            document.getElementById('modalProvas').style.display = 'none';
        });
        
        document.getElementById('btnCancelarEdicao').addEventListener('click', () => {
            document.getElementById('modalEditarProva').style.display = 'none';
        });
        
        document.getElementById('btnAbrirGabarito').addEventListener('click', () => {
            if (!provaAtual) { alert('Selecione uma prova primeiro!'); return; }
            document.getElementById('modalGabaritoTitulo').innerHTML = `📝 ${provaAtual.nome_prova}`;
            document.getElementById('infoQuestoes').innerHTML = `${NUM_QUESTOES} questões | ${OPCOES.join(', ')}`;
            renderizarModalGabarito();
            document.getElementById('modalGabarito').style.display = 'block';
        });
        
        document.getElementById('btnSalvarGabarito').addEventListener('click', async () => {
            await salvarGabaritoProvaAtual();
        });
        
        document.getElementById('btnFecharGabarito').addEventListener('click', () => {
            document.getElementById('modalGabarito').style.display = 'none';
        });
        
        document.getElementById('btnResetGabarito').addEventListener('click', () => {
            if (confirm('Resetar todas as respostas do gabarito?')) {
                gabarito = new Array(NUM_QUESTOES).fill(OPCOES[0]);
                renderizarModalGabarito();
            }
        });
        
        document.querySelectorAll('.btn-rapido').forEach(btn => {
            btn.addEventListener('click', () => {
                const questoes = parseInt(btn.dataset.questoes);
                document.getElementById('provaNumQuestoes').value = questoes;
            });
        });
        
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.style.display = 'none';
            });
        });
        
        document.getElementById('btnSair').addEventListener('click', () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
            localStorage.clear();
            window.location.href = 'index.html';
        });
        
        // ========== INICIALIZAÇÃO ==========
        async function iniciar() {
            await garantirUsuarioExistente();
            await carregarProvasDoSupabase();
            iniciarCamera();
        }
        
        iniciar();
    </script>
</body>
