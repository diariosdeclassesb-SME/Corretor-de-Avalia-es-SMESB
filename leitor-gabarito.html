<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Corrigir Gabarito - Modo Retrato</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: #000;
            padding: 12px;
        }
        
        .container {
            max-width: 500px;
            margin: auto;
            position: relative;
        }
        
        .header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            padding: 12px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .header h1 {
            font-size: 1.1rem;
            color: white;
        }
        
        .camera-container {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 10px;
            /* Modo retrato - altura maior que largura */
            aspect-ratio: 3 / 4;
            border: 2px solid rgba(255,255,255,0.2);
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Espelha para ficar igual ao preview */
        }
        
        .alignment-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
        }
        
        .guide-box {
            position: absolute;
            border: 3px solid rgba(255, 255, 0, 0.9);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5);
            display: none;
            transition: all 0.1s ease;
        }
        
        .guide-box.aligned {
            border-color: #00ff00;
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.3), 0 0 20px rgba(0, 255, 0, 0.5);
        }
        
        .guide-box.aligned::after {
            content: "✓ ALINHADO!";
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            background: #00ff00;
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
        }
        
        .status-alinhamento {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.8rem;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .status-alinhamento.good {
            background: rgba(0, 100, 0, 0.9);
            color: #00ff00;
        }
        
        .status-alinhamento.bad {
            background: rgba(139, 26, 26, 0.9);
            color: #ffaaaa;
        }
        
        button {
            width: 100%;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            margin: 5px 0;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-foto {
            background: #4461e4;
            color: white;
        }
        
        .btn-corrigir {
            background: #1a73e8;
            color: white;
        }
        
        .btn-gabarito {
            background: #3c39f5;
            color: white;
        }
        
        .btn-provas {
            background: #4caf50;
            color: white;
        }
        
        .btn-sair {
            background: #dc3545;
            color: white;
        }
        
        .btn-tentar-camera {
            background: #ffee00;
            font-size: 0.85rem;
        }
        
        .resultado {
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px;
            margin-top: 12px;
            display: none;
        }
        
        .acertos {
            font-size: 1.8rem;
            color: #4caf50;
            text-align: center;
            font-weight: bold;
        }
        
        .nota {
            font-size: 1.3rem;
            text-align: center;
            margin: 8px 0;
        }
        
        .detalhes {
            max-height: 250px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin-top: 12px;
        }
        
        .item-certo {
            background: #1b5e1b;
            padding: 5px 3px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.65rem;
        }
        
        .item-errado {
            background: #8b1a1a;
            padding: 5px 3px;
            border-radius: 6px;
            text-align: center;
            font-size: 0.65rem;
        }
        
        .info-usuario, .info-prova {
            background: rgba(44, 44, 44, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 0.8rem;
            text-align: center;
        }
        
        .info-gabarito {
            padding: 8px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 8px;
            font-size: 0.75rem;
        }
        
        .info-gabarito.carregado {
            background: rgba(76, 175, 80, 0.9);
        }
        
        .info-gabarito.nao-carregado {
            background: rgba(255, 68, 68, 0.9);
        }
        
        .row-buttons {
            display: flex;
            gap: 8px;
        }
        
        .row-buttons button {
            flex: 1;
        }
        
        .preview-area {
            margin-top: 10px;
            display: none;
        }
        
        .preview-area img {
            width: 100%;
            border-radius: 12px;
            border: 2px solid #4caf50;
        }
        
        .captura-auto-info {
            background: #2196f3;
            padding: 8px;
            border-radius: 10px;
            font-size: 0.7rem;
            text-align: center;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        
        .modal-content {
            background: #1e1e1e;
            border-radius: 20px;
            padding: 20px;
            max-width: 500px;
            margin: 20px auto;
        }
        
        .gabarito-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 20px;
            max-height: 350px;
            overflow-y: auto;
            padding: 10px;
        }
        
        .gab-item {
            background: #2c2c2c;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }
        
        .gab-item select {
            width: 100%;
            padding: 6px;
            border-radius: 6px;
            background: #444;
            color: white;
            border: none;
            text-align: center;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
        }
        
        .btn-salvar-gabarito {
            background: #4caf50;
        }
        
        .btn-fechar-modal {
            background: #666;
        }
        
        .debug-info {
            background: rgba(26, 26, 46, 0.95);
            padding: 8px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 0.65rem;
            font-family: monospace;
            display: none;
            max-height: 120px;
            overflow-y: auto;
        }
        
        .orientacao-aviso {
            background: rgba(255, 152, 0, 0.8);
            padding: 6px;
            border-radius: 8px;
            font-size: 0.7rem;
            text-align: center;
            margin-bottom: 8px;
            display: none;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Leitor de Gabarito</h1>
        </div>
        
        <div class="info-usuario" id="infoUsuario">Carregando...</div>
        <div class="info-prova" id="infoProva">📋 Nenhuma prova selecionada</div>
        <div class="info-gabarito nao-carregado" id="infoGabarito">⚠️ Selecione ou crie uma prova</div>
        
        <div class="orientacao-aviso" id="orientacaoAviso">
            📱 Segure o celular NA VERTICAL (retrato) para capturar a folha
        </div>
        
        <div class="status-alinhamento" id="statusAlinhamento">
            🟡 Aguardando câmera...
        </div>
        
        <div class="captura-auto-info">
            📸 Alinhe a folha dentro do quadrado → Captura automática
        </div>
        
        <div class="camera-container">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="alignmentCanvas" style="display: none;"></canvas>
            <div class="alignment-overlay">
                <div class="guide-box" id="guideBox"></div>
            </div>
        </div>
        
        <button class="btn-tentar-camera" id="btnTentarCamera">🔄 Reiniciar câmera</button>
        
        <div class="preview-area" id="previewArea">
            <img id="previewImg">
        </div>
        
        <div class="row-buttons">
            <button class="btn-provas" id="btnGerenciarProvas">📚 Provas</button>
            <button class="btn-foto" id="btnCapturar" disabled>📷 Capturar</button>
        </div>
        
        <button class="btn-gabarito" id="btnAbrirGabarito" disabled>📝 Editar Gabarito</button>
        <button class="btn-corrigir" id="btnCorrigir" disabled>🔍 Corrigir Prova</button>
        <button class="btn-sair" id="btnSair">🚪 Sair</button>
        
        <div id="resultadoPanel" class="resultado"></div>
        <div id="debugInfo" class="debug-info"></div>
    </div>
    
    <!-- Modal de Provas -->
    <div id="modalProvas" class="modal">
        <div class="modal-content">
            <h2>📚 Provas</h2>
            <div id="listaProvas"></div>
            <button id="btnFecharProvas" class="btn-fechar-modal">Fechar</button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ========== CONFIGURAÇÕES ==========
        const SUPABASE_URL = 'https://jmxtiaauezblgkichekx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpteHRpYWF1ZXpibGdraWNoZWt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDIyNjIsImV4cCI6MjA5NDYxODI2Mn0.jD0KRpdl85Cee24qwmV9nDNntR2Wk48DlJLcJnxoTyg';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Variáveis
        let provas = [];
        let provaAtual = null;
        let NUM_QUESTOES = 50;
        let NUM_OPCOES = 5;
        let OPCOES = ['A', 'B', 'C', 'D', 'E'];
        let gabarito = [];
        
        const LIMIAR_PREENCHIMENTO = 0.25;
        const BRILHO_MAXIMO_PREENCHIDO = 100;
        
        const usuarioId = localStorage.getItem('usuario_id');
        const usuarioNome = localStorage.getItem('usuario_nome');
        
        if (!usuarioId) {
            alert('⚠️ Faça login primeiro!');
            window.location.href = 'index.html';
        }
        
        document.getElementById('infoUsuario').innerHTML = `👨‍🏫 Olá, ${usuarioNome || 'Professor'}!`;
        
        // Elementos
        const video = document.getElementById('video');
        const guideBox = document.getElementById('guideBox');
        const statusAlinhamento = document.getElementById('statusAlinhamento');
        
        let stream = null;
        let imagemCapturada = null;
        let aligned = false;
        let autoCaptureTimeout = null;
        let isCapturing = false;
        
        // ========== FUNÇÕES SUPABASE ==========
        async function carregarProvasDoSupabase() {
            const { data, error } = await supabaseClient
                .from('provas')
                .select('*')
                .eq('usuario_id', usuarioId);
            
            if (!error && data) {
                provas = data;
                renderizarListaProvas();
                if (provas.length > 0 && !provaAtual) {
                    await selecionarProva(provas[0].id);
                }
            }
        }
        
        async function selecionarProva(provaId) {
            const { data } = await supabaseClient
                .from('provas')
                .select('*')
                .eq('id', provaId)
                .single();
            
            if (data) {
                provaAtual = data;
                NUM_QUESTOES = data.num_questoes;
                NUM_OPCOES = data.opcoes_por_questao;
                OPCOES = Array(NUM_OPCOES).fill().map((_, i) => String.fromCharCode(65 + i));
                gabarito = [...data.gabarito];
                
                document.getElementById('infoProva').innerHTML = `📋 ${provaAtual.nome_prova} (${NUM_QUESTOES} questões)`;
                document.getElementById('infoGabarito').innerHTML = `✅ Gabarito carregado!`;
                document.getElementById('infoGabarito').className = 'info-gabarito carregado';
                document.getElementById('btnAbrirGabarito').disabled = false;
            }
        }
        
        async function salvarCorrecao(acertos, nota, respostasAluno) {
            if (!provaAtual) return;
            
            let imagemBase64 = null;
            if (imagemCapturada) {
                imagemBase64 = imagemCapturada.toDataURL('image/jpeg', 0.5);
            }
            
            await supabaseClient
                .from('correcoes')
                .insert([{
                    prova_id: provaAtual.id,
                    usuario_id: usuarioId,
                    respostas_aluno: respostasAluno,
                    acertos: acertos,
                    nota: nota,
                    imagem_base64: imagemBase64,
                    data_correcao: new Date().toISOString()
                }]);
        }
        
        function renderizarListaProvas() {
            const container = document.getElementById('listaProvas');
            container.innerHTML = provas.map(p => `
                <div class="prova-item" style="background:#2c2c2c; padding:10px; margin:5px; border-radius:10px; cursor:pointer;" onclick="selecionarProva('${p.id}')">
                    <strong>${p.nome_prova}</strong><br>
                    <small>${p.num_questoes} questões</small>
                </div>
            `).join('');
        }
        
        window.selecionarProva = async (id) => {
            await selecionarProva(id);
            document.getElementById('modalProvas').style.display = 'none';
        };
        
        // ========== CÂMARA EM MODO RETRATO ==========
        async function iniciarCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            
            statusAlinhamento.innerHTML = '📷 Solicitando câmera...';
            
            try {
                // Força o modo retrato (vertical)
                const constraints = {
                    video: {
                        facingMode: { exact: "environment" },
                        width: { ideal: 1080 },
                        height: { ideal: 1920 }  // Prioriza altura maior (retrato)
                    }
                };
                
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                // Aguarda o video carregar
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });
                
                // Verifica orientação
                verificarOrientacao();
                
                statusAlinhamento.innerHTML = '🟡 Alinhe a folha dentro do quadrado amarelo';
                document.getElementById('btnCapturar').disabled = false;
                iniciarDeteccaoAlinhamento();
                
            } catch (err) {
                console.error('Erro câmera:', err);
                // Fallback para qualquer câmera disponível
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                    await video.play();
                    statusAlinhamento.innerHTML = '🟡 Alinhe a folha (modo alternativo)';
                    document.getElementById('btnCapturar').disabled = false;
                    iniciarDeteccaoAlinhamento();
                } catch (fallbackErr) {
                    statusAlinhamento.innerHTML = '❌ Não foi possível acessar a câmera';
                    statusAlinhamento.className = 'status-alinhamento bad';
                }
            }
        }
        
        function verificarOrientacao() {
            const orientacaoAviso = document.getElementById('orientacaoAviso');
            
            // Verifica a orientação da tela
            function checkOrientation() {
                if (window.innerHeight > window.innerWidth) {
                    orientacaoAviso.style.display = 'none';
                } else {
                    orientacaoAviso.style.display = 'block';
                    orientacaoAviso.style.animation = 'pulse 1s infinite';
                }
            }
            
            checkOrientation();
            window.addEventListener('resize', checkOrientation);
            window.addEventListener('orientationchange', checkOrientation);
        }
        
        function iniciarDeteccaoAlinhamento() {
            const canvas = document.getElementById('alignmentCanvas');
            const ctx = canvas.getContext('2d');
            
            function detectar() {
                if (!video.videoWidth || !video.videoHeight) {
                    requestAnimationFrame(detectar);
                    return;
                }
                
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const folha = detectarFolha(ctx, canvas.width, canvas.height);
                
                if (folha) {
                    const containerRect = document.querySelector('.camera-container').getBoundingClientRect();
                    const videoRect = video.getBoundingClientRect();
                    
                    const scaleX = videoRect.width / canvas.width;
                    const scaleY = videoRect.height / canvas.height;
                    
                    guideBox.style.left = `${folha.x * scaleX}px`;
                    guideBox.style.top = `${folha.y * scaleY}px`;
                    guideBox.style.width = `${folha.width * scaleX}px`;
                    guideBox.style.height = `${folha.height * scaleY}px`;
                    guideBox.style.display = 'block';
                    
                    // Verifica alinhamento (folha deve ocupar boa parte da tela)
                    const bemAlinhado = folha.coverage > 0.4 && folha.coverage < 0.95;
                    
                    if (bemAlinhado && !aligned) {
                        aligned = true;
                        guideBox.classList.add('aligned');
                        statusAlinhamento.innerHTML = '✅ Alinhado! Capturando em 1s...';
                        statusAlinhamento.className = 'status-alinhamento good';
                        
                        if (autoCaptureTimeout) clearTimeout(autoCaptureTimeout);
                        autoCaptureTimeout = setTimeout(() => {
                            if (aligned && !imagemCapturada && !isCapturing) {
                                capturarImagem();
                            }
                        }, 1000);
                        
                    } else if (!bemAlinhado && aligned) {
                        aligned = false;
                        guideBox.classList.remove('aligned');
                        statusAlinhamento.innerHTML = '🟡 Ajuste para a folha preencher o quadrado';
                        statusAlinhamento.className = 'status-alinhamento';
                        if (autoCaptureTimeout) clearTimeout(autoCaptureTimeout);
                    }
                } else {
                    guideBox.style.display = 'none';
                    if (aligned) {
                        aligned = false;
                        guideBox.classList.remove('aligned');
                        statusAlinhamento.innerHTML = '🔴 Folha não detectada. Aponte para a folha';
                        statusAlinhamento.className = 'status-alinhamento bad';
                    }
                }
                
                requestAnimationFrame(detectar);
            }
            
            detectar();
        }
        
        function detectarFolha(ctx, width, height) {
            const imageData = ctx.getImageData(0, 0, width, height);
            const data = imageData.data;
            
            let minX = width, minY = height, maxX = 0, maxY = 0;
            let encontrou = false;
            
            // Detecta pixels escuros (bordas/cantos da folha)
            const step = Math.max(1, Math.floor(Math.min(width, height) / 60));
            
            for (let y = 0; y < height; y += step) {
                for (let x = 0; x < width; x += step) {
                    const idx = (y * width + x) * 4;
                    const brilho = (data[idx] + data[idx+1] + data[idx+2]) / 3;
                    
                    if (brilho < 80) {
                        encontrou = true;
                        minX = Math.min(minX, x);
                        minY = Math.min(minY, y);
                        maxX = Math.max(maxX, x);
                        maxY = Math.max(maxY, y);
                    }
                }
            }
            
            if (encontrou && maxX > minX + 50 && maxY > minY + 50) {
                const folhaWidth = maxX - minX;
                const folhaHeight = maxY - minY;
                const coverage = (folhaWidth * folhaHeight) / (width * height);
                
                return {
                    x: minX,
                    y: minY,
                    width: folhaWidth,
                    height: folhaHeight,
                    coverage: coverage
                };
            }
            
            return null;
        }
        
        function capturarImagem() {
            if (isCapturing || imagemCapturada) return;
            isCapturing = true;
            
            console.log('📸 Capturando imagem...');
            
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            imagemCapturada = canvas;
            
            const previewImg = document.getElementById('previewImg');
            previewImg.src = canvas.toDataURL('image/jpeg');
            document.getElementById('previewArea').style.display = 'block';
            document.getElementById('btnCorrigir').disabled = false;
            
            statusAlinhamento.innerHTML = '✅ Imagem capturada! Clique em CORRIGIR';
            
            isCapturing = false;
        }
        
        // ========== DETECÇÃO DE RESPOSTAS ==========
        function detectarRespostasDaImagem(imgCanvas) {
            console.log('🔍 Iniciando detecção de respostas...');
            
            // Redimensiona mantendo proporção
            const targetHeight = 1200;
            const scale = targetHeight / imgCanvas.height;
            const targetWidth = Math.floor(imgCanvas.width * scale);
            
            const canvas = document.createElement('canvas');
            canvas.width = targetWidth;
            canvas.height = targetHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(imgCanvas, 0, 0, targetWidth, targetHeight);
            
            // Aumenta contraste
            const imageData = ctx.getImageData(0, 0, targetWidth, targetHeight);
            const data = imageData.data;
            
            for (let i = 0; i < data.length; i += 4) {
                let brilho = (data[i] + data[i+1] + data[i+2]) / 3;
                brilho = brilho < 128 ? brilho * 0.6 : brilho * 1.4;
                brilho = Math.min(255, Math.max(0, brilho));
                data[i] = brilho;
                data[i+1] = brilho;
                data[i+2] = brilho;
            }
            ctx.putImageData(imageData, 0, 0);
            
            // Calcula grade baseada na orientação correta
            // Como a folha é retrato, altura > largura
            const COLUNAS = Math.ceil(Math.sqrt(NUM_QUESTOES));
            const LINHAS = Math.ceil(NUM_QUESTOES / COLUNAS);
            
            const cellWidth = targetWidth / COLUNAS;
            const cellHeight = targetHeight / LINHAS;
            const circleRadius = Math.min(cellWidth, cellHeight) * 0.12;
            const optionsSpacing = cellWidth / (NUM_OPCOES + 1);
            
            const respostas = [];
            let questoesDetectadas = 0;
            const debugMsg = [];
            
            debugMsg.push(`📐 Dimensão: ${targetWidth}x${targetHeight}`);
            debugMsg.push(`📊 Grade: ${LINHAS} linhas x ${COLUNAS} colunas`);
            debugMsg.push(`🔘 Raio círculo: ${circleRadius.toFixed(1)}px`);
            
            for (let questao = 0; questao < NUM_QUESTOES; questao++) {
                const linha = Math.floor(questao / COLUNAS);
                const coluna = questao % COLUNAS;
                
                const cellCenterX = (coluna + 0.5) * cellWidth;
                const cellCenterY = (linha + 0.5) * cellHeight;
                
                let melhorOpcao = -1;
                let maiorPreenchimento = 0;
                
                for (let opt = 0; opt < NUM_OPCOES; opt++) {
                    const circleX = cellCenterX - cellWidth/2 + (opt + 1) * optionsSpacing;
                    const circleY = cellCenterY;
                    
                    let pixelsEscuros = 0;
                    let totalPixels = 0;
                    const raioInt = Math.floor(circleRadius);
                    
                    for (let dy = -raioInt; dy <= raioInt; dy++) {
                        for (let dx = -raioInt; dx <= raioInt; dx++) {
                            if (dx*dx + dy*dy <= circleRadius * circleRadius) {
                                const x = Math.floor(circleX + dx);
                                const y = Math.floor(circleY + dy);
                                
                                if (x >= 0 && x < targetWidth && y >= 0 && y < targetHeight) {
                                    const pixel = ctx.getImageData(x, y, 1, 1).data;
                                    const brilho = pixel[0];
                                    totalPixels++;
                                    if (brilho < BRILHO_MAXIMO_PREENCHIDO) {
                                        pixelsEscuros++;
                                    }
                                }
                            }
                        }
                    }
                    
                    const proporcao = totalPixels > 0 ? pixelsEscuros / totalPixels : 0;
                    
                    if (proporcao > LIMIAR_PREENCHIMENTO && proporcao > maiorPreenchimento) {
                        maiorPreenchimento = proporcao;
                        melhorOpcao = opt;
                    }
                }
                
                if (melhorOpcao >= 0) {
                    respostas.push(OPCOES[melhorOpcao]);
                    questoesDetectadas++;
                    if (questao < 15) {
                        debugMsg.push(`✅ Q${questao+1}: ${OPCOES[melhorOpcao]} (${(maiorPreenchimento*100).toFixed(0)}%)`);
                    }
                } else {
                    respostas.push(null);
                    if (questao < 15) {
                        debugMsg.push(`❌ Q${questao+1}: não detectado`);
                    }
                }
            }
            
            debugMsg.push(`\n📊 Total detectado: ${questoesDetectadas}/${NUM_QUESTOES} (${(questoesDetectadas/NUM_QUESTOES*100).toFixed(1)}%)`);
            
            const debugDiv = document.getElementById('debugInfo');
            debugDiv.innerHTML = debugMsg.join('<br>');
            debugDiv.style.display = 'block';
            
            return respostas;
        }
        
        // ========== CORREÇÃO ==========
        document.getElementById('btnCorrigir').addEventListener('click', async () => {
            if (!imagemCapturada) {
                alert('Capture uma foto primeiro!');
                return;
            }
            if (!provaAtual) {
                alert('Selecione uma prova primeiro!');
                return;
            }
            
            const btn = document.getElementById('btnCorrigir');
            btn.innerHTML = '🔄 Processando...';
            btn.disabled = true;
            
            setTimeout(async () => {
                try {
                    const respostasAluno = detectarRespostasDaImagem(imagemCapturada);
                    
                    let acertos = 0;
                    let questoesValidas = 0;
                    const detalhes = [];
                    const respostasSalvar = [];
                    
                    for (let i = 0; i < NUM_QUESTOES; i++) {
                        const aluno = respostasAluno[i];
                        const correto = gabarito[i];
                        
                        if (aluno === null) {
                            detalhes.push({ num: i+1, aluno: '○', gabarito: correto, certo: false });
                            respostasSalvar.push(null);
                        } else {
                            questoesValidas++;
                            const certo = (aluno === correto);
                            if (certo) acertos++;
                            detalhes.push({ num: i+1, aluno: aluno, gabarito: correto, certo: certo });
                            respostasSalvar.push(aluno);
                        }
                    }
                    
                    const nota = (acertos / NUM_QUESTOES) * 10;
                    
                    await salvarCorrecao(acertos, nota, respostasSalvar);
                    
                    const panel = document.getElementById('resultadoPanel');
                    panel.style.display = 'block';
                    panel.innerHTML = `
                        <div class="acertos">✅ ${acertos} / ${NUM_QUESTOES}</div>
                        <div class="nota">🎓 NOTA: ${nota.toFixed(1)}</div>
                        <div style="text-align:center; padding:8px; background:#333; border-radius:10px; margin:8px 0;">
                            📊 ${questoesValidas} questões detectadas | ${NUM_QUESTOES - questoesValidas} não preenchidas
                        </div>
                        <div class="detalhes" id="detalhesGrid"></div>
                        <button class="btn-novo" id="btnNovaCorrecao" style="background:#4caf50; margin-top:10px;">📷 Nova Correção</button>
                    `;
                    
                    const grid = document.getElementById('detalhesGrid');
                    grid.innerHTML = detalhes.map(d => `
                        <div class="${d.certo ? 'item-certo' : 'item-errado'}">
                            <strong>${d.num}</strong><br>${d.aluno === '○' ? '⚪' : d.aluno}<br><small>(${d.gabarito})</small>
                        </div>
                    `).join('');
                    
                    document.getElementById('btnNovaCorrecao').addEventListener('click', () => {
                        panel.style.display = 'none';
                        document.getElementById('previewArea').style.display = 'none';
                        imagemCapturada = null;
                        document.getElementById('debugInfo').style.display = 'none';
                        aligned = false;
                        guideBox.classList.remove('aligned');
                        statusAlinhamento.innerHTML = '🟡 Pronto para nova captura';
                        btn.disabled = false;
                    });
                    
                } catch (err) {
                    alert('Erro ao corrigir: ' + err.message);
                    console.error(err);
                }
                
                btn.innerHTML = '🔍 Corrigir Prova';
                btn.disabled = false;
            }, 100);
        });
        
        // ========== EVENTOS ==========
        document.getElementById('btnTentarCamera').addEventListener('click', () => {
            imagemCapturada = null;
            aligned = false;
            document.getElementById('previewArea').style.display = 'none';
            document.getElementById('resultadoPanel').style.display = 'none';
            document.getElementById('btnCorrigir').disabled = true;
            document.getElementById('debugInfo').style.display = 'none';
            iniciarCamera();
        });
        
        document.getElementById('btnCapturar').addEventListener('click', () => {
            if (!video.videoWidth) return;
            capturarImagem();
        });
        
        document.getElementById('btnGerenciarProvas').addEventListener('click', () => {
            renderizarListaProvas();
            document.getElementById('modalProvas').style.display = 'block';
        });
        
        document.getElementById('btnFecharProvas').addEventListener('click', () => {
            document.getElementById('modalProvas').style.display = 'none';
        });
        
        document.getElementById('btnAbrirGabarito').addEventListener('click', () => {
            if (!provaAtual) return;
            alert('Gabarito atual:\n' + gabarito.map((g, i) => `Q${i+1}: ${g}`).join('\n'));
        });
        
        document.getElementById('btnSair').addEventListener('click', () => {
            if (stream) stream.getTracks().forEach(t => t.stop());
            localStorage.clear();
            window.location.href = 'index.html';
        });
        
        // ========== INICIALIZAÇÃO ==========
        iniciarCamera();
        carregarProvasDoSupabase();
    </script>
</body>
</html>
