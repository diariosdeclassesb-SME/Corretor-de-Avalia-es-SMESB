<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Leitor de Gabarito - Tempo Real</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: #000;
            padding: 12px;
        }
        
        .container {
            max-width: 500px;
            margin: auto;
            position: relative;
        }
        
        .header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            padding: 12px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 10px;
        }
        
        .header h1 {
            font-size: 1.1rem;
            color: white;
        }
        
        .camera-container {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 10px;
            aspect-ratio: 3 / 4;
            border: 2px solid rgba(255,255,255,0.2);
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        
        .status-alinhamento {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.8rem;
            margin-bottom: 8px;
            font-weight: bold;
        }
        
        .status-alinhamento.good {
            background: rgba(0, 100, 0, 0.9);
            color: #00ff00;
        }
        
        .status-alinhamento.warning {
            background: rgba(100, 60, 0, 0.9);
            color: #ffaa00;
        }
        
        button {
            width: 100%;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            margin: 5px 0;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-corrigir { background: #1a73e8; color: white; }
        .btn-gabarito { background: #3c39f5; color: white; }
        .btn-provas { background: #4caf50; color: white; }
        .btn-sair { background: #dc3545; color: white; }
        .btn-tentar-camera { background: #ff9800; color: #000; font-size: 0.85rem; }
        
        .resultado-preview {
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px;
            margin-top: 12px;
        }
        
        .acertos-tempo-real {
            font-size: 1.5rem;
            color: #4caf50;
            text-align: center;
            font-weight: bold;
        }
        
        .nota-tempo-real {
            font-size: 1.1rem;
            text-align: center;
        }
        
        .respostas-grid {
            max-height: 150px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 3px;
            margin-top: 10px;
        }
        
        .resposta-item {
            padding: 3px;
            border-radius: 4px;
            text-align: center;
            font-size: 0.6rem;
        }
        
        .resposta-certa {
            background: #1b5e1b;
        }
        
        .resposta-errada {
            background: #8b1a1a;
        }
        
        .resposta-nao-detectada {
            background: #555;
        }
        
        .resposta-pendente {
            background: #333;
        }
        
        .info-usuario, .info-prova {
            background: rgba(44, 44, 44, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 0.8rem;
            text-align: center;
            color: white;
        }
        
        .info-gabarito {
            padding: 8px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 8px;
            font-size: 0.75rem;
        }
        
        .info-gabarito.carregado {
            background: rgba(76, 175, 80, 0.9);
        }
        
        .info-gabarito.nao-carregado {
            background: rgba(255, 68, 68, 0.9);
        }
        
        .row-buttons {
            display: flex;
            gap: 8px;
        }
        
        .row-buttons button {
            flex: 1;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        
        .modal-content {
            background: #1e1e1e;
            border-radius: 20px;
            padding: 20px;
            max-width: 500px;
            margin: 20px auto;
        }
        
        .modal-content h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #1a73e8;
            font-size: 1.3rem;
        }
        
        .config-item {
            margin-bottom: 15px;
        }
        
        .config-item label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 0.9rem;
            color: white;
        }
        
        .config-item input, .config-item select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: #333;
            color: white;
            font-size: 0.9rem;
        }
        
        .gabarito-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-bottom: 20px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
        }
        
        .gab-item {
            background: #2c2c2c;
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }
        
        .gab-item label {
            display: block;
            font-size: 0.65rem;
            color: #aaa;
            margin-bottom: 4px;
        }
        
        .gab-item select {
            width: 100%;
            padding: 6px;
            border-radius: 6px;
            background: #444;
            color: white;
            border: none;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .modal-buttons button {
            flex: 1;
            margin: 0;
        }
        
        .btn-salvar-gabarito { background: #4caf50; color: white; }
        .btn-fechar-modal { background: #666; color: white; }
        .btn-reset { background: #ff4444; color: white; margin-top: 10px; }
        .btn-nova-prova { background: #4caf50; color: white; margin-bottom: 12px; }
        
        .lista-provas {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .prova-item {
            background: #2c2c2c;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        
        .prova-item:hover {
            background: #3d3d3d;
        }
        
        .prova-info {
            flex: 1;
        }
        
        .prova-nome {
            font-weight: bold;
            font-size: 0.95rem;
            color: white;
        }
        
        .prova-detalhes {
            font-size: 0.65rem;
            color: #aaa;
        }
        
        .prova-acoes {
            display: flex;
            gap: 8px;
        }
        
        .btn-editar-prova {
            background: #2196f3;
            padding: 6px 10px;
            font-size: 0.7rem;
            margin: 0;
            width: auto;
            color: white;
        }
        
        .btn-excluir-prova {
            background: #ff4444;
            padding: 6px 10px;
            font-size: 0.7rem;
            margin: 0;
            width: auto;
            color: white;
        }
        
        .slider-container {
            background: #333;
            padding: 10px;
            border-radius: 12px;
            margin-top: 10px;
        }
        
        .slider-container label {
            color: white;
            font-size: 0.7rem;
        }
        
        input[type="range"] {
            width: 100%;
            margin: 5px 0;
        }
        
        .btn-corrigir-auto {
            background: #2196f3;
        }
        
        .btn-corrigir-auto.ativo {
            background: #f44336;
        }
        
        .indicador-qualidade {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Leitor de Gabarito - Tempo Real</h1>
        </div>
        
        <div class="info-usuario" id="infoUsuario">Carregando...</div>
        <div class="info-prova" id="infoProva">📋 Nenhuma prova selecionada</div>
        <div class="info-gabarito nao-carregado" id="infoGabarito">⚠️ Selecione ou crie uma prova</div>
        
        <div class="status-alinhamento" id="statusAlinhamento">
            🟡 Aguardando câmera...
        </div>
        
        <div class="camera-container">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="overlayCanvas"></canvas>
        </div>
        
        <div class="row-buttons">
            <button class="btn-provas" id="btnGerenciarProvas">📚 Provas</button>
            <button class="btn-corrigir-auto" id="btnCorrigirAuto">🎯 Leitura Automática</button>
        </div>
        
        <button class="btn-gabarito" id="btnAbrirGabarito" disabled>📝 Editar Gabarito</button>
        <button class="btn-sair" id="btnSair">🚪 Sair</button>
        
        <div class="slider-container">
            <label>🔧 Limiar de escurecimento (quanto menor, mais sensível):</label>
            <input type="range" id="limiarSlider" min="30" max="150" value="80">
            <span id="limiarValue" style="color:white;">80</span>
            <label style="display:block; margin-top:5px;">📊 Sensibilidade do círculo:</label>
            <input type="range" id="sensibilidadeSlider" min="0.10" max="0.50" step="0.01" value="0.22">
            <span id="sensibilidadeValue" style="color:white;">0.22</span>
        </div>
        
        <div class="resultado-preview" id="resultadoPreview" style="display: none;">
            <div class="acertos-tempo-real" id="acertosTempoReal">- / -</div>
            <div class="nota-tempo-real" id="notaTempoReal">🎓 NOTA: -</div>
            <div class="respostas-grid" id="respostasGrid"></div>
        </div>
    </div>
    
    <!-- Modal de Gerenciamento de Provas -->
    <div id="modalProvas" class="modal">
        <div class="modal-content">
            <h2>📚 Minhas Provas</h2>
            <button class="btn-nova-prova" id="btnNovaProva">➕ Criar Nova Prova</button>
            <div id="listaProvas" class="lista-provas"></div>
            <button id="btnFecharProvas" class="btn-fechar-modal">Fechar</button>
        </div>
    </div>
    
    <!-- Modal de Criar/Editar Prova -->
    <div id="modalEditarProva" class="modal">
        <div class="modal-content">
            <h2 id="modalEditarTitulo">📝 Criar Nova Prova</h2>
            <div class="config-item">
                <label>📛 Nome da prova:</label>
                <input type="text" id="provaNome" placeholder="Ex: Prova 1 - Matemática">
            </div>
            <div class="config-item">
                <label>📊 Quantidade de questões (padrão 60):</label>
                <input type="number" id="provaNumQuestoes" min="10" max="100" step="5" value="60">
            </div>
            <div class="config-item">
                <label>🔤 Número de alternativas:</label>
                <select id="provaNumOpcoes">
                    <option value="4">4 opções (A, B, C, D)</option>
                    <option value="5" selected>5 opções (A, B, C, D, E)</option>
                    <option value="6">6 opções (A, B, C, D, E, F)</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button id="btnCriarProva" class="btn-salvar-gabarito">💾 Criar Prova</button>
                <button id="btnCancelarEdicao" class="btn-fechar-modal">Cancelar</button>
            </div>
        </div>
    </div>
    
    <!-- Modal do Gabarito -->
    <div id="modalGabarito" class="modal">
        <div class="modal-content">
            <h2 id="modalGabaritoTitulo">📝 Editar Gabarito</h2>
            <div style="text-align: center; margin-bottom: 15px; font-size: 0.75rem; color: #aaa;" id="infoQuestoes">
                Carregando...
            </div>
            <div id="gabaritoLista" class="gabarito-grid"></div>
            <div class="modal-buttons">
                <button id="btnSalvarGabarito" class="btn-salvar-gabarito">💾 Salvar Gabarito</button>
                <button id="btnFecharGabarito" class="btn-fechar-modal">Fechar</button>
            </div>
            <button id="btnResetGabarito" class="btn-reset">🔄 Resetar Gabarito</button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ========== CONFIGURAÇÕES ==========
        const SUPABASE_URL = 'https://jmxtiaauezblgkichekx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpteHRpYWF1ZXpibGdraWNoZWt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDIyNjIsImV4cCI6MjA5NDYxODI2Mn0.jD0KRpdl85Cee24qwmV9nDNntR2Wk48DlJLcJnxoTyg';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        const LINHAS_QUESTOES = 10;
        const COLUNAS_QUESTOES = 6;
        
        let provas = [];
        let provaAtual = null;
        let NUM_QUESTOES = 60;
        let NUM_OPCOES = 5;
        let OPCOES = ['A', 'B', 'C', 'D', 'E'];
        let gabarito = [];
        
        const usuarioId = localStorage.getItem('usuario_id');
        const usuarioNome = localStorage.getItem('usuario_nome');
        
        if (!usuarioId) {
            alert('⚠️ Faça login primeiro!');
            window.location.href = 'index.html';
        }
        
        document.getElementById('infoUsuario').innerHTML = `👨‍🏫 Olá, ${usuarioNome || 'Professor'}!`;
        
        // Elementos
        const video = document.getElementById('video');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const statusAlinhamento = document.getElementById('statusAlinhamento');
        const limiarSlider = document.getElementById('limiarSlider');
        const limiarValue = document.getElementById('limiarValue');
        const sensibilidadeSlider = document.getElementById('sensibilidadeSlider');
        const sensibilidadeValue = document.getElementById('sensibilidadeValue');
        
        let stream = null;
        let limiarDetecao = 80;
        let sensibilidadeCirculo = 0.22;
        let leituraAtiva = false;
        let frameInterval = null;
        let ultimoProcessamento = 0;
        
        limiarSlider.addEventListener('input', (e) => {
            limiarDetecao = parseInt(e.target.value);
            limiarValue.textContent = limiarDetecao;
        });
        
        sensibilidadeSlider.addEventListener('input', (e) => {
            sensibilidadeCirculo = parseFloat(e.target.value);
            sensibilidadeValue.textContent = sensibilidadeCirculo;
        });
        
        // ========== FUNÇÕES SUPABASE ==========
        async function garantirUsuarioExistente() {
            const { data: existe } = await supabaseClient
                .from('usuarios')
                .select('id')
                .eq('id', usuarioId)
                .maybeSingle();
            
            if (!existe) {
                await supabaseClient.from('usuarios').insert([{
                    id: usuarioId,
                    nome: usuarioNome || 'Professor',
                    email: localStorage.getItem('usuario_email') || '',
                    criado_em: new Date().toISOString()
                }]);
            }
        }
        
        async function carregarProvasDoSupabase() {
            try {
                const { data, error } = await supabaseClient
                    .from('provas')
                    .select('*')
                    .eq('usuario_id', usuarioId)
                    .order('criado_em', { ascending: false });
                
                if (error) throw error;
                
                provas = data || [];
                renderizarListaProvas();
                
                if (provas.length === 0) {
                    document.getElementById('infoProva').innerHTML = '📋 Nenhuma prova criada';
                    document.getElementById('infoGabarito').innerHTML = '⚠️ Clique em "Provas" para criar';
                } else if (!provaAtual) {
                    await selecionarProva(provas[0].id);
                }
            } catch (err) {
                console.error('Erro ao carregar provas:', err);
            }
        }
        
        async function selecionarProva(provaId) {
            try {
                const { data, error } = await supabaseClient
                    .from('provas')
                    .select('*')
                    .eq('id', provaId)
                    .single();
                
                if (error) throw error;
                
                provaAtual = data;
                NUM_QUESTOES = data.num_questoes;
                NUM_OPCOES = data.opcoes_por_questao;
                OPCOES = Array(NUM_OPCOES).fill().map((_, i) => String.fromCharCode(65 + i));
                gabarito = [...data.gabarito];
                
                document.getElementById('infoProva').innerHTML = `📋 ${provaAtual.nome_prova} (${NUM_QUESTOES} questões | ${NUM_OPCOES} opções)`;
                document.getElementById('infoGabarito').innerHTML = `✅ Gabarito carregado!`;
                document.getElementById('infoGabarito').className = 'info-gabarito carregado';
                document.getElementById('btnAbrirGabarito').disabled = false;
                
                document.getElementById('modalProvas').style.display = 'none';
                
                // Se a leitura automática estiver ativa, reinicia para atualizar com novo gabarito
                if (leituraAtiva) {
                    processarFrame();
                }
            } catch (err) {
                console.error('Erro ao selecionar prova:', err);
            }
        }
        
        async function salvarProva(nome, numQuestoes, numOpcoes, editId = null) {
            const opcoes = Array(numOpcoes).fill().map((_, i) => String.fromCharCode(65 + i));
            const novoGabarito = new Array(numQuestoes).fill(opcoes[0]);
            
            if (editId) {
                await supabaseClient
                    .from('provas')
                    .update({
                        nome_prova: nome,
                        num_questoes: numQuestoes,
                        opcoes_por_questao: numOpcoes,
                        gabarito: novoGabarito
                    })
                    .eq('id', editId);
            } else {
                await supabaseClient
                    .from('provas')
                    .insert([{
                        usuario_id: usuarioId,
                        nome_prova: nome,
                        num_questoes: numQuestoes,
                        opcoes_por_questao: numOpcoes,
                        gabarito: novoGabarito
                    }]);
            }
            
            await carregarProvasDoSupabase();
        }
        
        async function excluirProva(provaId) {
            if (!confirm('Tem certeza que deseja excluir esta prova?')) return;
            
            await supabaseClient
                .from('provas')
                .delete()
                .eq('id', provaId);
            
            if (provaAtual && provaAtual.id === provaId) {
                provaAtual = null;
                document.getElementById('infoProva').innerHTML = '📋 Nenhuma prova selecionada';
                document.getElementById('infoGabarito').innerHTML = '⚠️ Selecione ou crie uma prova';
                document.getElementById('btnAbrirGabarito').disabled = true;
            }
            
            await carregarProvasDoSupabase();
        }
        
        async function salvarGabaritoProvaAtual() {
            if (!provaAtual) return;
            
            const { error } = await supabaseClient
                .from('provas')
                .update({ gabarito: gabarito })
                .eq('id', provaAtual.id);
            
            if (error) {
                alert('Erro ao salvar gabarito: ' + error.message);
            } else {
                alert('✅ Gabarito salvo com sucesso!');
                document.getElementById('modalGabarito').style.display = 'none';
            }
        }
        
        async function salvarCorrecao(acertos, nota, respostasAluno, imagemBase64) {
            if (!provaAtual) return;
            
            await supabaseClient
                .from('correcoes')
                .insert([{
                    prova_id: provaAtual.id,
                    usuario_id: usuarioId,
                    respostas_aluno: respostasAluno,
                    acertos: acertos,
                    nota: nota,
                    imagem_base64: imagemBase64,
                    data_correcao: new Date().toISOString()
                }]);
        }
        
        function renderizarListaProvas() {
            const container = document.getElementById('listaProvas');
            
            if (provas.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:#aaa;">Nenhuma prova criada ainda</div>';
                return;
            }
            
            container.innerHTML = provas.map(prova => `
                <div class="prova-item" data-id="${prova.id}">
                    <div class="prova-info">
                        <div class="prova-nome">${prova.nome_prova}</div>
                        <div class="prova-detalhes">${prova.num_questoes} questões | ${prova.opcoes_por_questao} opções</div>
                    </div>
                    <div class="prova-acoes">
                        <button class="btn-editar-prova" data-id="${prova.id}">✏️</button>
                        <button class="btn-excluir-prova" data-id="${prova.id}">🗑️</button>
                    </div>
                </div>
            `).join('');
            
            document.querySelectorAll('.prova-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('btn-editar-prova') && !e.target.classList.contains('btn-excluir-prova')) {
                        selecionarProva(item.dataset.id);
                    }
                });
            });
            
            document.querySelectorAll('.btn-editar-prova').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    const prova = provas.find(p => p.id == id);
                    if (prova) {
                        document.getElementById('provaNome').value = prova.nome_prova;
                        document.getElementById('provaNumQuestoes').value = prova.num_questoes;
                        document.getElementById('provaNumOpcoes').value = prova.opcoes_por_questao;
                        document.getElementById('modalEditarTitulo').innerHTML = '✏️ Editar Prova';
                        document.getElementById('modalEditarProva').dataset.editId = id;
                        document.getElementById('modalEditarProva').style.display = 'block';
                        document.getElementById('modalProvas').style.display = 'none';
                    }
                });
            });
            
            document.querySelectorAll('.btn-excluir-prova').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    const id = btn.dataset.id;
                    await excluirProva(id);
                });
            });
        }
        
        function renderizarModalGabarito() {
            const container = document.getElementById('gabaritoLista');
            container.innerHTML = '';
            
            for (let i = 0; i < NUM_QUESTOES; i++) {
                const div = document.createElement('div');
                div.className = 'gab-item';
                div.innerHTML = `
                    <label>Q${i+1}</label>
                    <select id="gabSelect_${i}" data-questao="${i}">
                        ${OPCOES.map(op => `<option value="${op}" ${gabarito[i] === op ? 'selected' : ''}>${op}</option>`).join('')}
                    </select>
                `;
                container.appendChild(div);
            }
            
            for (let i = 0; i < NUM_QUESTOES; i++) {
                const select = document.getElementById(`gabSelect_${i}`);
                if (select) {
                    select.addEventListener('change', (e) => {
                        const questao = parseInt(e.target.dataset.questao);
                        gabarito[questao] = e.target.value;
                    });
                }
            }
        }
        
        // ========== CÂMERA ==========
        async function iniciarCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
            
            statusAlinhamento.innerHTML = '📷 Solicitando câmera...';
            
            try {
                const constraints = {
                    video: {
                        facingMode: { exact: "environment" },
                        width: { ideal: 1080 },
                        height: { ideal: 1920 }
                    }
                };
                
                stream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = stream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });
                
                statusAlinhamento.innerHTML = '🟡 Aponte para a folha de respostas - A leitura é automática!';
                document.getElementById('btnCorrigirAuto').disabled = false;
                
                // Inicia a leitura automática
                iniciarLeituraAutomatica();
                
            } catch (err) {
                console.error('Erro câmera:', err);
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                    await video.play();
                    statusAlinhamento.innerHTML = '🟡 Aponte para a folha de respostas';
                    iniciarLeituraAutomatica();
                } catch (fallbackErr) {
                    statusAlinhamento.innerHTML = '❌ Não foi possível acessar a câmera';
                }
            }
        }
        
        function iniciarLeituraAutomatica() {
            if (frameInterval) clearInterval(frameInterval);
            
            leituraAtiva = true;
            document.getElementById('btnCorrigirAuto').innerHTML = '⏹️ Parar Leitura';
            document.getElementById('btnCorrigirAuto').classList.add('ativo');
            
            // Processa a cada 500ms
            frameInterval = setInterval(() => {
                if (leituraAtiva && video.videoWidth > 0 && provaAtual) {
                    processarFrame();
                }
            }, 500);
        }
        
        function pararLeituraAutomatica() {
            if (frameInterval) {
                clearInterval(frameInterval);
                frameInterval = null;
            }
            leituraAtiva = false;
            document.getElementById('btnCorrigirAuto').innerHTML = '🎯 Leitura Automática';
            document.getElementById('btnCorrigirAuto').classList.remove('ativo');
            
            // Limpa o overlay
            const ctx = overlayCanvas.getContext('2d');
            ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        }
        
        function alternarLeitura() {
            if (leituraAtiva) {
                pararLeituraAutomatica();
            } else {
                iniciarLeituraAutomatica();
            }
        }
        
        // ========== DETECÇÃO EM TEMPO REAL ==========
        function capturarFrameAtual() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return canvas;
        }
        
        function detectarRespostasEmFrame(imgCanvas) {
            const targetWidth = 800; // Menor para performance
            const scale = targetWidth / imgCanvas.width;
            const targetHeight = Math.floor(imgCanvas.height * scale);
            
            const canvas = document.createElement('canvas');
            canvas.width = targetWidth;
            canvas.height = targetHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(imgCanvas, 0, 0, targetWidth, targetHeight);
            
            // Configura o canvas de overlay com o mesmo tamanho
            overlayCanvas.width = targetWidth;
            overlayCanvas.height = targetHeight;
            const overlayCtx = overlayCanvas.getContext('2d');
            
            // Obtém dados da imagem
            const imageData = ctx.getImageData(0, 0, targetWidth, targetHeight);
            const dadosOriginais = new Uint8ClampedArray(imageData.data);
            
            // Área de respostas (após o cabeçalho)
            const margemTopo = targetHeight * 0.22;
            const margemBaixo = targetHeight * 0.05;
            const margemEsquerda = targetWidth * 0.08;
            const margemDireita = targetWidth * 0.08;
            
            const areaTopo = margemTopo;
            const areaBaixo = targetHeight - margemBaixo;
            const areaEsquerda = margemEsquerda;
            const areaDireita = targetWidth - margemDireita;
            
            const cellWidth = (areaDireita - areaEsquerda) / COLUNAS_QUESTOES;
            const cellHeight = (areaBaixo - areaTopo) / LINHAS_QUESTOES;
            const circleRadius = Math.min(cellWidth, cellHeight) * 0.10;
            const optionsSpacing = cellWidth / (NUM_OPCOES + 1);
            
            // Limpa o overlay
            overlayCtx.clearRect(0, 0, targetWidth, targetHeight);
            overlayCtx.globalAlpha = 0.8;
            
            // Desenha a área de detecção
            overlayCtx.strokeStyle = '#ffff00';
            overlayCtx.lineWidth = 2;
            overlayCtx.strokeRect(areaEsquerda, areaTopo, areaDireita - areaEsquerda, areaBaixo - areaTopo);
            
            // Desenha grade
            overlayCtx.strokeStyle = '#00ff00';
            overlayCtx.lineWidth = 1;
            for (let i = 0; i <= COLUNAS_QUESTOES; i++) {
                const x = areaEsquerda + i * cellWidth;
                overlayCtx.beginPath();
                overlayCtx.moveTo(x, areaTopo);
                overlayCtx.lineTo(x, areaBaixo);
                overlayCtx.stroke();
            }
            for (let i = 0; i <= LINHAS_QUESTOES; i++) {
                const y = areaTopo + i * cellHeight;
                overlayCtx.beginPath();
                overlayCtx.moveTo(areaEsquerda, y);
                overlayCtx.lineTo(areaDireita, y);
                overlayCtx.stroke();
            }
            
            function isPixelDark(x, y, dados) {
                if (x < 0 || x >= targetWidth || y < 0 || y >= targetHeight) return false;
                const idx = (Math.floor(y) * targetWidth + Math.floor(x)) * 4;
                const brilho = (dados[idx] + dados[idx+1] + dados[idx+2]) / 3;
                return brilho < limiarDetecao;
            }
            
            function calcularPreenchimentoCirculo(cx, cy, raio, dados) {
                let pixelsEscuros = 0;
                let totalPixels = 0;
                const raioInt = Math.floor(raio);
                
                for (let dy = -raioInt; dy <= raioInt; dy++) {
                    for (let dx = -raioInt; dx <= raioInt; dx++) {
                        if (dx*dx + dy*dy <= raio * raio) {
                            const x = cx + dx;
                            const y = cy + dy;
                            if (x >= 0 && x < targetWidth && y >= 0 && y < targetHeight) {
                                totalPixels++;
                                if (isPixelDark(x, y, dados)) {
                                    pixelsEscuros++;
                                }
                            }
                        }
                    }
                }
                return totalPixels > 0 ? pixelsEscuros / totalPixels : 0;
            }
            
            const respostas = [];
            let questoesDetectadas = 0;
            let questaoIndex = 0;
            
            for (let linha = 0; linha < LINHAS_QUESTOES; linha++) {
                for (let coluna = 0; coluna < COLUNAS_QUESTOES; coluna++) {
                    if (questaoIndex >= NUM_QUESTOES) break;
                    
                    const cellCenterX = areaEsquerda + (coluna + 0.5) * cellWidth;
                    const cellCenterY = areaTopo + (linha + 0.5) * cellHeight;
                    
                    let melhorOpcao = -1;
                    let maiorPreenchimento = 0;
                    let totalPreenchidas = 0;
                    
                    for (let opt = 0; opt < NUM_OPCOES; opt++) {
                        const circleX = cellCenterX - cellWidth/2 + (opt + 1) * optionsSpacing;
                        const circleY = cellCenterY;
                        
                        const proporcao = calcularPreenchimentoCirculo(circleX, circleY, circleRadius, dadosOriginais);
                        
                        overlayCtx.beginPath();
                        overlayCtx.arc(circleX, circleY, circleRadius, 0, 2 * Math.PI);
                        
                        if (proporcao > sensibilidadeCirculo) {
                            overlayCtx.fillStyle = `rgba(0, 200, 0, 0.7)`;
                            overlayCtx.fill();
                            overlayCtx.strokeStyle = '#00ff00';
                            totalPreenchidas++;
                            if (proporcao > maiorPreenchimento) {
                                maiorPreenchimento = proporcao;
                                melhorOpcao = opt;
                            }
                        } else if (proporcao > 0.10) {
                            overlayCtx.fillStyle = `rgba(255, 150, 0, 0.5)`;
                            overlayCtx.fill();
                            overlayCtx.strokeStyle = '#ffaa00';
                        } else {
                            overlayCtx.strokeStyle = '#ff4444';
                        }
                        overlayCtx.stroke();
                        
                        overlayCtx.font = `bold ${Math.max(8, circleRadius)}px Arial`;
                        overlayCtx.fillStyle = '#ffffff';
                        overlayCtx.shadowBlur = 2;
                        overlayCtx.shadowColor = 'black';
                        overlayCtx.fillText(OPCOES[opt], circleX - 5, circleY + 5);
                        overlayCtx.shadowBlur = 0;
                    }
                    
                    // Número da questão
                    overlayCtx.font = `bold ${Math.max(9, circleRadius + 2)}px Arial`;
                    overlayCtx.fillStyle = '#ffff00';
                    overlayCtx.fillText(`${questaoIndex+1}`, cellCenterX - cellWidth/2 + 5, cellCenterY - cellHeight/2 + 15);
                    
                    if (melhorOpcao >= 0 && totalPreenchidas === 1) {
                        respostas.push(OPCOES[melhorOpcao]);
                        questoesDetectadas++;
                        overlayCtx.fillStyle = 'rgba(0,255,0,0.15)';
                        overlayCtx.fillRect(cellCenterX - cellWidth/2, cellCenterY - cellHeight/2, cellWidth, cellHeight);
                    } else if (totalPreenchidas > 1) {
                        respostas.push(null);
                        overlayCtx.fillStyle = 'rgba(255,255,0,0.15)';
                        overlayCtx.fillRect(cellCenterX - cellWidth/2, cellCenterY - cellHeight/2, cellWidth, cellHeight);
                    } else {
                        respostas.push(null);
                        overlayCtx.fillStyle = 'rgba(255,0,0,0.1)';
                        overlayCtx.fillRect(cellCenterX - cellWidth/2, cellCenterY - cellHeight/2, cellWidth, cellHeight);
                    }
                    
                    questaoIndex++;
                }
                if (questaoIndex >= NUM_QUESTOES) break;
            }
            
            return { respostas, questoesDetectadas };
        }
        
        function atualizarInterfaceResultados(respostas, questoesDetectadas) {
            if (!provaAtual) return;
            
            let acertos = 0;
            const detalhes = [];
            
            for (let i = 0; i < NUM_QUESTOES; i++) {
                const aluno = respostas[i];
                const correto = gabarito[i];
                
                if (aluno === null) {
                    detalhes.push({ num: i+1, aluno: '⚪', correto: false, certo: false });
                } else {
                    const certo = (aluno === correto);
                    if (certo) acertos++;
                    detalhes.push({ num: i+1, aluno: aluno, correto: correto, certo: certo });
                }
            }
            
            const nota = (acertos / NUM_QUESTOES) * 10;
            
            document.getElementById('resultadoPreview').style.display = 'block';
            document.getElementById('acertosTempoReal').innerHTML = `✅ ${acertos} / ${NUM_QUESTOES}`;
            document.getElementById('notaTempoReal').innerHTML = `🎓 NOTA: ${nota.toFixed(1)}`;
            
            const grid = document.getElementById('respostasGrid');
            grid.innerHTML = detalhes.map(d => `
                <div class="resposta-item ${d.aluno === '⚪' ? 'resposta-nao-detectada' : (d.certo ? 'resposta-certa' : 'resposta-errada')}">
                    <strong>${d.num}</strong><br>${d.aluno}<br><small>${d.aluno !== '⚪' ? '(' + d.correto + ')' : ''}</small>
                </div>
            `).join('');
            
            // Feedback visual da qualidade
            if (questoesDetectadas > NUM_QUESTOES * 0.8) {
                statusAlinhamento.innerHTML = `✅ Ótimo! ${questoesDetectadas}/${NUM_QUESTOES} questões detectadas`;
                statusAlinhamento.className = 'status-alinhamento good';
            } else if (questoesDetectadas > NUM_QUESTOES * 0.5) {
                statusAlinhamento.innerHTML = `🟡 Razoável: ${questoesDetectadas}/${NUM_QUESTOES} questões detectadas. Ajuste o enquadramento.`;
                statusAlinhamento.className = 'status-alinhamento warning';
            } else {
                statusAlinhamento.innerHTML = `🔴 Poucas questões detectadas (${questoesDetectadas}/${NUM_QUESTOES}). Verifique iluminação e enquadramento.`;
                statusAlinhamento.className = '';
            }
        }
        
        function processarFrame() {
            if (!provaAtual || !video.videoWidth) return;
            
            try {
                const frame = capturarFrameAtual();
                const { respostas, questoesDetectadas } = detectarRespostasEmFrame(frame);
                atualizarInterfaceResultados(respostas, questoesDetectadas);
            } catch (err) {
                console.error('Erro ao processar frame:', err);
            }
        }
        
        // ========== EVENTOS ==========
        document.getElementById('btnCorrigirAuto').addEventListener('click', alternarLeitura);
        
        document.getElementById('btnGerenciarProvas').addEventListener('click', () => {
            renderizarListaProvas();
            document.getElementById('modalProvas').style.display = 'block';
        });
        
        document.getElementById('btnNovaProva').addEventListener('click', () => {
            document.getElementById('provaNome').value = '';
            document.getElementById('provaNumQuestoes').value = 60;
            document.getElementById('provaNumOpcoes').value = 5;
            document.getElementById('modalEditarTitulo').innerHTML = '📝 Criar Nova Prova';
            delete document.getElementById('modalEditarProva').dataset.editId;
            document.getElementById('modalEditarProva').style.display = 'block';
            document.getElementById('modalProvas').style.display = 'none';
        });
        
        document.getElementById('btnCriarProva').addEventListener('click', async () => {
            const nome = document.getElementById('provaNome').value.trim();
            const numQuestoes = parseInt(document.getElementById('provaNumQuestoes').value);
            const numOpcoes = parseInt(document.getElementById('provaNumOpcoes').value);
            
            if (!nome) { alert('Digite um nome para a prova!'); return; }
            
            const editId = document.getElementById('modalEditarProva').dataset.editId;
            
            const btn = document.getElementById('btnCriarProva');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Salvando...';
            btn.disabled = true;
            
            try {
                await salvarProva(nome, numQuestoes, numOpcoes, editId);
                document.getElementById('modalEditarProva').style.display = 'none';
                alert(`✅ Prova "${nome}" salva com sucesso!`);
            } catch (err) {
                alert('Erro ao salvar prova: ' + err.message);
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
        
        document.getElementById('btnFecharProvas').addEventListener('click', () => {
            document.getElementById('modalProvas').style.display = 'none';
        });
        
        document.getElementById('btnCancelarEdicao').addEventListener('click', () => {
            document.getElementById('modalEditarProva').style.display = 'none';
        });
        
        document.getElementById('btnAbrirGabarito').addEventListener('click', () => {
            if (!provaAtual) { alert('Selecione uma prova primeiro!'); return; }
            document.getElementById('modalGabaritoTitulo').innerHTML = `📝 ${provaAtual.nome_prova}`;
            document.getElementById('infoQuestoes').innerHTML = `${NUM_QUESTOES} questões | ${OPCOES.join(', ')}`;
            renderizarModalGabarito();
            document.getElementById('modalGabarito').style.display = 'block';
        });
        
        document.getElementById('btnSalvarGabarito').addEventListener('click', async () => {
            await salvarGabaritoProvaAtual();
        });
        
        document.getElementById('btnFecharGabarito').addEventListener('click', () => {
            document.getElementById('modalGabarito').style.display = 'none';
        });
        
        document.getElementById('btnResetGabarito').addEventListener('click', () => {
            if (confirm('Resetar todas as respostas do gabarito?')) {
                gabarito = new Array(NUM_QUESTOES).fill(OPCOES[0]);
                renderizarModalGabarito();
            }
        });
        
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) modal.style.display = 'none';
            });
        });
        
        document.getElementById('btnSair').addEventListener('click', () => {
            pararLeituraAutomatica();
            if (stream) stream.getTracks().forEach(t => t.stop());
            localStorage.clear();
            window.location.href = 'index.html';
        });
        
        // ========== INICIALIZAÇÃO ==========
        async function iniciar() {
            await garantirUsuarioExistente();
            await carregarProvasDoSupabase();
            iniciarCamera();
        }
        
        iniciar();
    </script>
</body>
