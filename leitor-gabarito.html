<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Leitor de Gabarito - Câmera Fixa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #000;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Área superior FIXA - câmera sempre visível */
        .camera-section {
            flex-shrink: 0;
            background: #000;
            padding: 8px 12px 0 12px;
            border-bottom: 2px solid #333;
        }
        
        .header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            padding: 8px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 6px;
        }
        
        .header h1 {
            font-size: 0.9rem;
            color: white;
        }
        
        .info-usuario, .info-prova {
            background: rgba(44, 44, 44, 0.95);
            padding: 5px 8px;
            border-radius: 10px;
            margin-bottom: 5px;
            font-size: 0.65rem;
            text-align: center;
            color: white;
        }
        
        .info-gabarito {
            padding: 4px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 5px;
            font-size: 0.65rem;
        }
        
        .info-gabarito.carregado {
            background: rgba(76, 175, 80, 0.9);
        }
        
        .info-gabarito.nao-carregado {
            background: rgba(255, 68, 68, 0.9);
        }
        
        .status-alinhamento {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            padding: 6px;
            border-radius: 10px;
            text-align: center;
            font-size: 0.7rem;
            margin-bottom: 6px;
            font-weight: bold;
        }
        
        .status-alinhamento.good {
            background: rgba(0, 100, 0, 0.9);
            color: #00ff00;
        }
        
        .status-alinhamento.warning {
            background: rgba(100, 60, 0, 0.9);
            color: #ffaa00;
        }
        
        .camera-container {
            position: relative;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 6px;
            aspect-ratio: 3 / 4;
            border: 2px solid rgba(255,255,255,0.2);
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        
        .btn-corrigir-auto {
            background: #1a73e8;
            color: white;
            padding: 10px;
            font-size: 0.85rem;
            border-radius: 25px;
            margin: 4px 0;
        }
        
        .btn-corrigir-auto.ativo {
            background: #f44336;
        }
        
        .row-buttons {
            display: flex;
            gap: 8px;
            margin: 4px 0;
        }
        
        .row-buttons button {
            flex: 1;
            padding: 8px;
            font-size: 0.75rem;
            border-radius: 20px;
        }
        
        button {
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        .btn-gabarito { background: #3c39f5; color: white; padding: 8px; font-size: 0.75rem; border-radius: 20px; margin: 4px 0; }
        .btn-sair { background: #dc3545; color: white; padding: 8px; font-size: 0.75rem; border-radius: 20px; margin: 4px 0; }
        .btn-provas { background: #4caf50; color: white; }
        
        .slider-container {
            background: #333;
            padding: 6px 8px;
            border-radius: 10px;
            margin: 4px 0;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .slider-container label {
            color: white;
            font-size: 0.6rem;
        }
        
        input[type="range"] {
            flex: 1;
            min-width: 100px;
        }
        
        /* Área de resultados ROLÁVEL */
        .resultados-section {
            flex: 1;
            overflow-y: auto;
            padding: 8px 12px 12px 12px;
            background: #0a0a0a;
        }
        
        .resultado-preview {
            background: rgba(30, 30, 30, 0.95);
            border-radius: 16px;
            padding: 10px;
        }
        
        .acertos-tempo-real {
            font-size: 1.2rem;
            color: #4caf50;
            text-align: center;
            font-weight: bold;
        }
        
        .nota-tempo-real {
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 8px;
        }
        
        .respostas-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
            margin-top: 8px;
            max-height: 250px;
            overflow-y: auto;
        }
        
        .resposta-item {
            padding: 4px 2px;
            border-radius: 4px;
            text-align: center;
            font-size: 0.55rem;
            font-weight: bold;
        }
        
        .resposta-certa {
            background: #1b5e1b;
        }
        
        .resposta-errada {
            background: #8b1a1a;
        }
        
        .resposta-nao-detectada {
            background: #555;
        }
        
        .instrucao {
            background: rgba(0,0,0,0.6);
            padding: 4px;
            border-radius: 8px;
            font-size: 0.55rem;
            text-align: center;
            color: #ffaa00;
            margin-bottom: 4px;
        }
        
        /* Modais (mantidos) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        
        .modal-content {
            background: #1e1e1e;
            border-radius: 20px;
            padding: 20px;
            max-width: 500px;
            margin: 20px auto;
        }
        
        .modal-content h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #1a73e8;
            font-size: 1.1rem;
        }
        
        .config-item {
            margin-bottom: 15px;
        }
        
        .config-item label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            color: white;
        }
        
        .config-item input, .config-item select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: #333;
            color: white;
            font-size: 0.85rem;
        }
        
        .gabarito-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            margin-bottom: 20px;
            max-height: 350px;
            overflow-y: auto;
            padding: 10px;
        }
        
        .gab-item {
            background: #2c2c2c;
            padding: 5px;
            border-radius: 6px;
            text-align: center;
        }
        
        .gab-item label {
            display: block;
            font-size: 0.6rem;
            color: #aaa;
        }
        
        .gab-item select {
            width: 100%;
            padding: 4px;
            border-radius: 4px;
            background: #444;
            color: white;
            border: none;
            text-align: center;
            font-size: 0.7rem;
        }
        
        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .modal-buttons button {
            flex: 1;
            margin: 0;
            padding: 10px;
            border-radius: 20px;
        }
        
        .btn-salvar-gabarito { background: #4caf50; color: white; }
        .btn-fechar-modal { background: #666; color: white; }
        .btn-reset { background: #ff4444; color: white; margin-top: 10px; padding: 10px; border-radius: 20px; }
        .btn-nova-prova { background: #4caf50; color: white; margin-bottom: 12px; padding: 10px; border-radius: 20px; }
        
        .lista-provas {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .prova-item {
            background: #2c2c2c;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        
        .prova-info {
            flex: 1;
        }
        
        .prova-nome {
            font-weight: bold;
            font-size: 0.85rem;
            color: white;
        }
        
        .prova-detalhes {
            font-size: 0.6rem;
            color: #aaa;
        }
        
        .prova-acoes {
            display: flex;
            gap: 8px;
        }
        
        .btn-editar-prova, .btn-excluir-prova {
            padding: 5px 10px;
            font-size: 0.7rem;
            border-radius: 15px;
        }
        
        .btn-editar-prova { background: #2196f3; color: white; }
        .btn-excluir-prova { background: #ff4444; color: white; }
        
        .badge {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        @keyframes pulse {
            0% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        .gravando {
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>
    <!-- Área FIXA da câmera -->
    <div class="camera-section">
        <div class="header">
            <h1>📸 Leitor de Gabarito</h1>
        </div>
        
        <div class="info-usuario" id="infoUsuario">Carregando...</div>
        <div class="info-prova" id="infoProva">📋 Nenhuma prova selecionada</div>
        <div class="info-gabarito nao-carregado" id="infoGabarito">⚠️ Selecione ou crie uma prova</div>
        
        <div class="status-alinhamento" id="statusAlinhamento">
            🟡 Aguardando câmera...
        </div>
        
        <div class="instrucao">
            💡 Alinhe a grade VERMELHA com as 3 colunas da folha
        </div>
        
        <div class="camera-container">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="overlayCanvas"></canvas>
        </div>
        
        <button class="btn-corrigir-auto" id="btnCorrigirAuto" disabled>🎯 Iniciar Leitura Automática</button>
        
        <div class="row-buttons">
            <button class="btn-provas" id="btnGerenciarProvas">📚 Provas</button>
            <button class="btn-gabarito" id="btnAbrirGabarito" disabled>📝 Gabarito</button>
            <button class="btn-sair" id="btnSair">🚪 Sair</button>
        </div>
        
        <div class="slider-container">
            <label>🔧 Limiar:</label>
            <input type="range" id="limiarSlider" min="30" max="150" value="80">
            <span id="limiarValue" style="color:white;">80</span>
            <label>🎯 Sensib.:</label>
            <input type="range" id="sensibilidadeSlider" min="0.10" max="0.50" step="0.01" value="0.22">
            <span id="sensibilidadeValue" style="color:white;">0.22</span>
        </div>
    </div>
    
    <!-- Área ROLÁVEL de resultados -->
    <div class="resultados-section">
        <div class="resultado-preview" id="resultadoPreview" style="display: none;">
            <div class="acertos-tempo-real" id="acertosTempoReal">- / -</div>
            <div class="nota-tempo-real" id="notaTempoReal">🎓 NOTA: -</div>
            <div class="respostas-grid" id="respostasGrid"></div>
        </div>
    </div>
    
    <!-- Modais -->
    <div id="modalProvas" class="modal">
        <div class="modal-content">
            <h2>📚 Minhas Provas</h2>
            <button class="btn-nova-prova" id="btnNovaProva">➕ Criar Nova Prova</button>
            <div id="listaProvas" class="lista-provas"></div>
            <button id="btnFecharProvas" class="btn-fechar-modal">Fechar</button>
        </div>
    </div>
    
    <div id="modalEditarProva" class="modal">
        <div class="modal-content">
            <h2 id="modalEditarTitulo">📝 Criar Nova Prova</h2>
            <div class="config-item">
                <label>📛 Nome da prova:</label>
                <input type="text" id="provaNome" placeholder="Ex: Prova 1">
            </div>
            <div class="config-item">
                <label>📊 Quantidade de questões:</label>
                <input type="number" id="provaNumQuestoes" min="10" max="100" step="5" value="60">
            </div>
            <div class="config-item">
                <label>🔤 Número de alternativas:</label>
                <select id="provaNumOpcoes">
                    <option value="4">4 opções (A, B, C, D)</option>
                    <option value="5" selected>5 opções (A, B, C, D, E)</option>
                    <option value="6">6 opções (A, B, C, D, E, F)</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button id="btnCriarProva" class="btn-salvar-gabarito">💾 Criar Prova</button>
                <button id="btnCancelarEdicao" class="btn-fechar-modal">Cancelar</button>
            </div>
        </div>
    </div>
    
    <div id="modalGabarito" class="modal">
        <div class="modal-content">
            <h2 id="modalGabaritoTitulo">📝 Editar Gabarito</h2>
            <div id="gabaritoLista" class="gabarito-grid"></div>
            <div class="modal-buttons">
                <button id="btnSalvarGabarito" class="btn-salvar-gabarito">💾 Salvar</button>
                <button id="btnFecharGabarito" class="btn-fechar-modal">Fechar</button>
            </div>
            <button id="btnResetGabarito" class="btn-reset">🔄 Resetar Gabarito</button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ========== CONFIGURAÇÕES ==========
        const SUPABASE_URL = 'https://jmxtiaauezblgkichekx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpteHRpYWF1ZXpibGdraWNoZWt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDIyNjIsImV4cCI6MjA5NDYxODI2Mn0.jD0KRpdl85Cee24qwmV9nDNntR2Wk48DlJLcJnxoTyg';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Layout: 20 linhas × 3 colunas = 60 questões
        const LINHAS_QUESTOES = 20;
        const COLUNAS_QUESTOES = 3;
        
        let provas = [], provaAtual = null, NUM_QUESTOES = 60, NUM_OPCOES = 5, OPCOES = ['A','B','C','D','E'], gabarito = [];
        const usuarioId = localStorage.getItem('usuario_id'), usuarioNome = localStorage.getItem('usuario_nome');
        if (!usuarioId) { alert('⚠️ Faça login!'); window.location.href = 'index.html'; }
        document.getElementById('infoUsuario').innerHTML = `👨‍🏫 ${usuarioNome || 'Professor'}`;
        
        const video = document.getElementById('video'), overlayCanvas = document.getElementById('overlayCanvas'), statusAlinhamento = document.getElementById('statusAlinhamento');
        const limiarSlider = document.getElementById('limiarSlider'), limiarValue = document.getElementById('limiarValue');
        const sensibilidadeSlider = document.getElementById('sensibilidadeSlider'), sensibilidadeValue = document.getElementById('sensibilidadeValue');
        
        let stream = null, limiarDetecao = 80, sensibilidadeCirculo = 0.22, leituraAtiva = false, frameInterval = null;
        
        limiarSlider.addEventListener('input', (e) => { limiarDetecao = parseInt(e.target.value); limiarValue.textContent = limiarDetecao; });
        sensibilidadeSlider.addEventListener('input', (e) => { sensibilidadeCirculo = parseFloat(e.target.value); sensibilidadeValue.textContent = sensibilidadeCirculo; });
        
        // ========== SUPABASE FUNCTIONS ==========
        async function garantirUsuarioExistente() {
            const { data: existe } = await supabaseClient.from('usuarios').select('id').eq('id', usuarioId).maybeSingle();
            if (!existe) await supabaseClient.from('usuarios').insert([{ id: usuarioId, nome: usuarioNome || 'Professor', email: localStorage.getItem('usuario_email') || '', criado_em: new Date().toISOString() }]);
        }
        
        async function carregarProvasDoSupabase() {
            try {
                const { data, error } = await supabaseClient.from('provas').select('*').eq('usuario_id', usuarioId).order('criado_em', { ascending: false });
                if (error) throw error;
                provas = data || [];
                renderizarListaProvas();
                if (provas.length === 0) document.getElementById('infoProva').innerHTML = '📋 Nenhuma prova';
                else if (!provaAtual) await selecionarProva(provas[0].id);
            } catch (err) { console.error(err); }
        }
        
        async function selecionarProva(provaId) {
            try {
                const { data, error } = await supabaseClient.from('provas').select('*').eq('id', provaId).single();
                if (error) throw error;
                provaAtual = data;
                NUM_QUESTOES = data.num_questoes;
                NUM_OPCOES = data.opcoes_por_questao;
                OPCOES = Array(NUM_OPCOES).fill().map((_, i) => String.fromCharCode(65 + i));
                gabarito = [...data.gabarito];
                document.getElementById('infoProva').innerHTML = `📋 ${provaAtual.nome_prova} (${NUM_QUESTOES}q | ${NUM_OPCOES}op)`;
                document.getElementById('infoGabarito').innerHTML = `✅ Gabarito carregado!`;
                document.getElementById('infoGabarito').className = 'info-gabarito carregado';
                document.getElementById('btnAbrirGabarito').disabled = false;
                document.getElementById('modalProvas').style.display = 'none';
            } catch (err) { console.error(err); }
        }
        
        async function salvarProva(nome, numQuestoes, numOpcoes, editId = null) {
            const opcoes = Array(numOpcoes).fill().map((_, i) => String.fromCharCode(65 + i));
            const novoGabarito = new Array(numQuestoes).fill(opcoes[0]);
            if (editId) await supabaseClient.from('provas').update({ nome_prova: nome, num_questoes: numQuestoes, opcoes_por_questao: numOpcoes, gabarito: novoGabarito }).eq('id', editId);
            else await supabaseClient.from('provas').insert([{ usuario_id: usuarioId, nome_prova: nome, num_questoes: numQuestoes, opcoes_por_questao: numOpcoes, gabarito: novoGabarito }]);
            await carregarProvasDoSupabase();
        }
        
        async function excluirProva(provaId) {
            if (!confirm('Excluir esta prova?')) return;
            await supabaseClient.from('provas').delete().eq('id', provaId);
            if (provaAtual && provaAtual.id === provaId) { provaAtual = null; document.getElementById('btnAbrirGabarito').disabled = true; }
            await carregarProvasDoSupabase();
        }
        
        async function salvarGabaritoProvaAtual() {
            if (!provaAtual) return;
            await supabaseClient.from('provas').update({ gabarito: gabarito }).eq('id', provaAtual.id);
            alert('✅ Gabarito salvo!');
            document.getElementById('modalGabarito').style.display = 'none';
        }
        
        function renderizarListaProvas() {
            const container = document.getElementById('listaProvas');
            if (provas.length === 0) { container.innerHTML = '<div style="text-align:center; padding:20px; color:#aaa;">Nenhuma prova</div>'; return; }
            container.innerHTML = provas.map(prova => `<div class="prova-item" data-id="${prova.id}"><div class="prova-info"><div class="prova-nome">${prova.nome_prova}</div><div class="prova-detalhes">${prova.num_questoes} questões | ${prova.opcoes_por_questao} opções</div></div><div class="prova-acoes"><button class="btn-editar-prova" data-id="${prova.id}">✏️</button><button class="btn-excluir-prova" data-id="${prova.id}">🗑️</button></div></div>`).join('');
            document.querySelectorAll('.prova-item').forEach(item => { item.addEventListener('click', (e) => { if (!e.target.classList.contains('btn-editar-prova') && !e.target.classList.contains('btn-excluir-prova')) selecionarProva(item.dataset.id); }); });
            document.querySelectorAll('.btn-editar-prova').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); const prova = provas.find(p => p.id == btn.dataset.id); if (prova) { document.getElementById('provaNome').value = prova.nome_prova; document.getElementById('provaNumQuestoes').value = prova.num_questoes; document.getElementById('provaNumOpcoes').value = prova.opcoes_por_questao; document.getElementById('modalEditarTitulo').innerHTML = '✏️ Editar Prova'; document.getElementById('modalEditarProva').dataset.editId = prova.id; document.getElementById('modalEditarProva').style.display = 'block'; document.getElementById('modalProvas').style.display = 'none'; } }); });
            document.querySelectorAll('.btn-excluir-prova').forEach(btn => { btn.addEventListener('click', async (e) => { e.stopPropagation(); await excluirProva(btn.dataset.id); }); });
        }
        
        function renderizarModalGabarito() {
            const container = document.getElementById('gabaritoLista');
            container.innerHTML = '';
            for (let i = 0; i < NUM_QUESTOES; i++) {
                const div = document.createElement('div');
                div.className = 'gab-item';
                div.innerHTML = `<label>Q${i+1}</label><select id="gabSelect_${i}" data-questao="${i}">${OPCOES.map(op => `<option value="${op}" ${gabarito[i] === op ? 'selected' : ''}>${op}</option>`).join('')}</select>`;
                container.appendChild(div);
            }
            for (let i = 0; i < NUM_QUESTOES; i++) document.getElementById(`gabSelect_${i}`)?.addEventListener('change', (e) => { gabarito[parseInt(e.target.dataset.questao)] = e.target.value; });
        }
        
        // ========== CÂMERA ==========
        async function iniciarCamera() {
            if (stream) stream.getTracks().forEach(track => track.stop());
            statusAlinhamento.innerHTML = '📷 Solicitando câmera...';
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { exact: "environment" }, width: { ideal: 1080 }, height: { ideal: 1920 } } });
                video.srcObject = stream;
                await new Promise(resolve => { video.onloadedmetadata = () => { video.play(); resolve(); }; });
                statusAlinhamento.innerHTML = '🟡 Alinhe a grade VERMELHA com as 3 colunas da folha';
                document.getElementById('btnCorrigirAuto').disabled = false;
            } catch (err) {
                try { stream = await navigator.mediaDevices.getUserMedia({ video: true }); video.srcObject = stream; await video.play(); statusAlinhamento.innerHTML = '🟡 Alinhe a grade'; } 
                catch (e) { statusAlinhamento.innerHTML = '❌ Erro na câmera'; }
            }
        }
        
        function iniciarLeitura() {
            if (frameInterval) clearInterval(frameInterval);
            leituraAtiva = true;
            document.getElementById('btnCorrigirAuto').innerHTML = '⏹️ Parar Leitura';
            document.getElementById('btnCorrigirAuto').classList.add('ativo');
            frameInterval = setInterval(() => { if (leituraAtiva && video.videoWidth > 0 && provaAtual) processarFrame(); }, 350);
        }
        
        function pararLeitura() {
            if (frameInterval) clearInterval(frameInterval);
            leituraAtiva = false;
            document.getElementById('btnCorrigirAuto').innerHTML = '🎯 Iniciar Leitura Automática';
            document.getElementById('btnCorrigirAuto').classList.remove('ativo');
            const ctx = overlayCanvas.getContext('2d');
            if (ctx) ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        }
        
        function processarFrame() {
            if (!provaAtual || !video.videoWidth) return;
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            tempCanvas.getContext('2d').drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
            
            const targetWidth = 900;
            const scale = targetWidth / tempCanvas.width;
            const targetHeight = Math.floor(tempCanvas.height * scale);
            
            const canvas = document.createElement('canvas');
            canvas.width = targetWidth;
            canvas.height = targetHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(tempCanvas, 0, 0, targetWidth, targetHeight);
            
            overlayCanvas.width = targetWidth;
            overlayCanvas.height = targetHeight;
            const overlayCtx = overlayCanvas.getContext('2d');
            
            const imageData = ctx.getImageData(0, 0, targetWidth, targetHeight);
            const dados = new Uint8ClampedArray(imageData.data);
            
            // Área da folha
            const topoFolha = targetHeight * 0.18;
            const baseFolha = targetHeight * 0.92;
            const esquerdaFolha = targetWidth * 0.04;
            const direitaFolha = targetWidth * 0.96;
            
            const larguraColuna = (direitaFolha - esquerdaFolha) / COLUNAS_QUESTOES;
            const alturaLinha = (baseFolha - topoFolha) / LINHAS_QUESTOES;
            const circleRadius = Math.min(larguraColuna, alturaLinha) * 0.11;
            const opcaoStartX = larguraColuna * 0.22;
            const espacamentoOpcoes = larguraColuna * 0.16;
            
            overlayCtx.clearRect(0, 0, targetWidth, targetHeight);
            overlayCtx.globalAlpha = 0.85;
            
            // Desenha as 3 colunas (VERMELHO)
            overlayCtx.strokeStyle = '#ff0000';
            overlayCtx.lineWidth = 3;
            for (let col = 0; col < COLUNAS_QUESTOES; col++) {
                const colX = esquerdaFolha + col * larguraColuna;
                overlayCtx.strokeRect(colX, topoFolha, larguraColuna, baseFolha - topoFolha);
            }
            
            // Linhas horizontais
            overlayCtx.strokeStyle = '#ff6666';
            overlayCtx.lineWidth = 1;
            for (let linha = 1; linha < LINHAS_QUESTOES; linha++) {
                const y = topoFolha + linha * alturaLinha;
                overlayCtx.beginPath();
                overlayCtx.moveTo(esquerdaFolha, y);
                overlayCtx.lineTo(direitaFolha, y);
                overlayCtx.stroke();
            }
            
            function isPixelDark(x, y) {
                if (x < 0 || x >= targetWidth || y < 0 || y >= targetHeight) return false;
                const idx = (Math.floor(y) * targetWidth + Math.floor(x)) * 4;
                const brilho = (dados[idx] + dados[idx+1] + dados[idx+2]) / 3;
                return brilho < limiarDetecao;
            }
            
            function calcularPreenchimento(cx, cy, raio) {
                let escuros = 0, total = 0;
                const raioInt = Math.floor(raio);
                for (let dy = -raioInt; dy <= raioInt; dy++) {
                    for (let dx = -raioInt; dx <= raioInt; dx++) {
                        if (dx*dx + dy*dy <= raio * raio) {
                            total++;
                            if (isPixelDark(cx + dx, cy + dy)) escuros++;
                        }
                    }
                }
                return total > 0 ? escuros / total : 0;
            }
            
            const respostas = [];
            let questoesDetectadas = 0;
            let questaoIndex = 0;
            
            for (let linha = 0; linha < LINHAS_QUESTOES; linha++) {
                const cellY = topoFolha + linha * alturaLinha;
                const cellCenterY = cellY + alturaLinha / 2;
                
                for (let col = 0; col < COLUNAS_QUESTOES; col++) {
                    if (questaoIndex >= NUM_QUESTOES) break;
                    
                    const colX = esquerdaFolha + col * larguraColuna;
                    
                    let melhorOpcao = -1;
                    let maiorPreenchimento = 0;
                    let totalPreenchidas = 0;
                    
                    for (let opt = 0; opt < NUM_OPCOES; opt++) {
                        const opcaoX = colX + opcaoStartX + (opt * espacamentoOpcoes);
                        const opcaoY = cellCenterY;
                        
                        const preenchimento = calcularPreenchimento(opcaoX, opcaoY, circleRadius);
                        
                        overlayCtx.beginPath();
                        overlayCtx.arc(opcaoX, opcaoY, circleRadius, 0, 2 * Math.PI);
                        
                        if (preenchimento > sensibilidadeCirculo) {
                            overlayCtx.fillStyle = `rgba(0, 255, 0, 0.8)`;
                            overlayCtx.fill();
                            overlayCtx.strokeStyle = '#00ff00';
                            totalPreenchidas++;
                            if (preenchimento > maiorPreenchimento) {
                                maiorPreenchimento = preenchimento;
                                melhorOpcao = opt;
                            }
                        } else {
                            overlayCtx.strokeStyle = '#ff8888';
                        }
                        overlayCtx.stroke();
                        
                        overlayCtx.font = `${Math.max(7, circleRadius)}px Arial`;
                        overlayCtx.fillStyle = 'white';
                        overlayCtx.fillText(OPCOES[opt], opcaoX - 4, opcaoY + 4);
                    }
                    
                    // Número da questão
                    overlayCtx.font = `bold ${Math.max(8, circleRadius + 2)}px Arial`;
                    overlayCtx.fillStyle = '#ffff00';
                    overlayCtx.fillText(`${questaoIndex+1}`, colX + 5, cellY + 15);
                    
                    if (melhorOpcao >= 0 && totalPreenchidas === 1) {
                        respostas.push(OPCOES[melhorOpcao]);
                        questoesDetectadas++;
                        overlayCtx.fillStyle = 'rgba(0,255,0,0.15)';
                        overlayCtx.fillRect(colX, cellY, larguraColuna, alturaLinha);
                    } else if (totalPreenchidas > 1) {
                        respostas.push(null);
                        overlayCtx.fillStyle = 'rgba(255,255,0,0.15)';
                        overlayCtx.fillRect(colX, cellY, larguraColuna, alturaLinha);
                    } else {
                        respostas.push(null);
                        overlayCtx.fillStyle = 'rgba(255,0,0,0.1)';
                        overlayCtx.fillRect(colX, cellY, larguraColuna, alturaLinha);
                    }
                    
                    questaoIndex++;
                }
                if (questaoIndex >= NUM_QUESTOES) break;
            }
            
            // Calcula e exibe resultados
            let acertos = 0;
            const detalhes = [];
            for (let i = 0; i < NUM_QUESTOES; i++) {
                const aluno = respostas[i];
                const correto = gabarito[i];
                if (aluno === null) {
                    detalhes.push({ num: i+1, aluno: '⚪', certo: false });
                } else {
                    const certo = (aluno === correto);
                    if (certo) acertos++;
                    detalhes.push({ num: i+1, aluno: aluno, certo: certo });
                }
            }
            
            const nota = (acertos / NUM_QUESTOES) * 10;
            document.getElementById('resultadoPreview').style.display = 'block';
            document.getElementById('acertosTempoReal').innerHTML = `✅ ${acertos} / ${NUM_QUESTOES}`;
            document.getElementById('notaTempoReal').innerHTML = `🎓 NOTA: ${nota.toFixed(1)}`;
            
            const grid = document.getElementById('respostasGrid');
            grid.innerHTML = detalhes.map(d => `<div class="resposta-item ${d.aluno === '⚪' ? 'resposta-nao-detectada' : (d.certo ? 'resposta-certa' : 'resposta-errada')}">${d.num}<br>${d.aluno}</div>`).join('');
            
            // Feedback visual
            if (questoesDetectadas > NUM_QUESTOES * 0.8) {
                statusAlinhamento.innerHTML = `✅ Excelente! ${questoesDetectadas}/60 detectadas`;
                statusAlinhamento.className = 'status-alinhamento good';
            } else if (questoesDetectadas > 35) {
                statusAlinhamento.innerHTML = `🟡 ${questoesDetectadas}/60 - Ajuste o alinhamento`;
                statusAlinhamento.className = 'status-alinhamento warning';
            } else {
                statusAlinhamento.innerHTML = `🔴 ${questoesDetectadas}/60 - Alinhe as 3 colunas dentro das caixas VERMELHAS`;
                statusAlinhamento.className = '';
            }
        }
        
        // ========== EVENTOS ==========
        document.getElementById('btnCorrigirAuto').addEventListener('click', () => { if (leituraAtiva) pararLeitura(); else iniciarLeitura(); });
        document.getElementById('btnGerenciarProvas').addEventListener('click', () => { renderizarListaProvas(); document.getElementById('modalProvas').style.display = 'block'; });
        document.getElementById('btnNovaProva').addEventListener('click', () => { document.getElementById('provaNome').value = ''; document.getElementById('provaNumQuestoes').value = 60; document.getElementById('provaNumOpcoes').value = 5; document.getElementById('modalEditarTitulo').innerHTML = '📝 Criar Prova'; delete document.getElementById('modalEditarProva').dataset.editId; document.getElementById('modalEditarProva').style.display = 'block'; document.getElementById('modalProvas').style.display = 'none'; });
        document.getElementById('btnCriarProva').addEventListener('click', async () => { const nome = document.getElementById('provaNome').value.trim(); const numQuestoes = parseInt(document.getElementById('provaNumQuestoes').value); const numOpcoes = parseInt(document.getElementById('provaNumOpcoes').value); if (!nome) { alert('Digite um nome!'); return; } const editId = document.getElementById('modalEditarProva').dataset.editId; await salvarProva(nome, numQuestoes, numOpcoes, editId); document.getElementById('modalEditarProva').style.display = 'none'; alert(`✅ Prova "${nome}" salva!`); });
        document.getElementById('btnFecharProvas').addEventListener('click', () => { document.getElementById('modalProvas').style.display = 'none'; });
        document.getElementById('btnCancelarEdicao').addEventListener('click', () => { document.getElementById('modalEditarProva').style.display = 'none'; });
        document.getElementById('btnAbrirGabarito').addEventListener('click', () => { if (!provaAtual) { alert('Selecione uma prova!'); return; } renderizarModalGabarito(); document.getElementById('modalGabarito').style.display = 'block'; });
        document.getElementById('btnSalvarGabarito').addEventListener('click', async () => { await salvarGabaritoProvaAtual(); });
        document.getElementById('btnFecharGabarito').addEventListener('click', () => { document.getElementById('modalGabarito').style.display = 'none'; });
        document.getElementById('btnResetGabarito').addEventListener('click', () => { if (confirm('Resetar gabarito?')) { gabarito = new Array(NUM_QUESTOES).fill(OPCOES[0]); renderizarModalGabarito(); } });
        document.querySelectorAll('.modal').forEach(modal => { modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; }); });
        document.getElementById('btnSair').addEventListener('click', () => { pararLeitura(); if (stream) stream.getTracks().forEach(t => t.stop()); localStorage.clear(); window.location.href = 'index.html'; });
        
        // Inicialização
        async function iniciar() {
            await garantirUsuarioExistente();
            await carregarProvasDoSupabase();
            iniciarCamera();
        }
        iniciar();
    </script>
</body>
