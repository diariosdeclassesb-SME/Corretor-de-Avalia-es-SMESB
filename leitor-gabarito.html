<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Leitor de Gabarito - 40 Questões</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            background: #000;
            padding: 12px;
        }
        .container { max-width: 500px; margin: auto; position: relative; }
        .header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            padding: 12px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 10px;
        }
        .header h1 { font-size: 1rem; color: white; }
        .camera-container {
            position: relative;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 10px;
            aspect-ratio: 3 / 4;
            border: 2px solid rgba(255,255,255,0.2);
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        .status-alinhamento {
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            font-size: 0.75rem;
            margin-bottom: 8px;
            font-weight: bold;
            color: #ffaa00;
        }
        .status-alinhamento.good { background: rgba(0, 100, 0, 0.9); color: #00ff00; }
        .status-alinhamento.warning { background: rgba(100, 60, 0, 0.9); color: #ffaa00; }
        button {
            width: 100%;
            padding: 12px;
            font-size: 0.85rem;
            font-weight: bold;
            border: none;
            border-radius: 25px;
            margin: 5px 0;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:active { transform: scale(0.98); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-corrigir-auto { background: #1a73e8; color: white; }
        .btn-gabarito { background: #3c39f5; color: white; }
        .btn-provas { background: #4caf50; color: white; }
        .btn-sair { background: #dc3545; color: white; }
        .resultado-preview {
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 12px;
            margin-top: 12px;
        }
        .acertos-tempo-real {
            font-size: 1.3rem;
            color: #4caf50;
            text-align: center;
            font-weight: bold;
        }
        .nota-tempo-real {
            font-size: 1rem;
            text-align: center;
            color: white;
        }
        .respostas-grid {
            max-height: 150px;
            overflow-y: auto;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            margin-top: 10px;
        }
        .resposta-item {
            padding: 2px;
            border-radius: 3px;
            text-align: center;
            font-size: 0.55rem;
            color: white;
        }
        .resposta-certa { background: #1b5e1b; }
        .resposta-errada { background: #8b1a1a; }
        .resposta-nao-detectada { background: #555; }
        .info-usuario, .info-prova {
            background: rgba(44, 44, 44, 0.95);
            backdrop-filter: blur(10px);
            padding: 8px;
            border-radius: 12px;
            margin-bottom: 8px;
            font-size: 0.7rem;
            text-align: center;
            color: white;
        }
        .info-gabarito {
            padding: 6px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 8px;
            font-size: 0.7rem;
        }
        .info-gabarito.carregado { background: rgba(76, 175, 80, 0.9); color: white; }
        .info-gabarito.nao-carregado { background: rgba(255, 68, 68, 0.9); color: white; }
        .row-buttons { display: flex; gap: 8px; }
        .row-buttons button { flex: 1; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        .modal-content {
            background: #1e1e1e;
            border-radius: 20px;
            padding: 20px;
            max-width: 500px;
            margin: 20px auto;
            color: white;
        }
        .modal-content h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #1a73e8;
            font-size: 1.1rem;
        }
        .config-item { margin-bottom: 15px; }
        .config-item label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            color: white;
        }
        .config-item input, .config-item select {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: #333;
            color: white;
            font-size: 0.85rem;
        }
        .gabarito-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            margin-bottom: 20px;
            max-height: 350px;
            overflow-y: auto;
            padding: 10px;
        }
        .gab-item {
            background: #2c2c2c;
            padding: 5px;
            border-radius: 6px;
            text-align: center;
        }
        .gab-item label {
            display: block;
            font-size: 0.6rem;
            color: #aaa;
        }
        .gab-item select {
            width: 100%;
            padding: 4px;
            border-radius: 4px;
            background: #444;
            color: white;
            border: none;
            text-align: center;
            font-size: 0.7rem;
        }
        .modal-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .modal-buttons button { flex: 1; margin: 0; }
        .btn-salvar-gabarito { background: #4caf50; color: white; }
        .btn-fechar-modal { background: #666; color: white; }
        .btn-reset { background: #ff4444; color: white; margin-top: 10px; }
        .btn-nova-prova { background: #4caf50; color: white; margin-bottom: 12px; }
        .lista-provas { max-height: 300px; overflow-y: auto; }
        .prova-item {
            background: #2c2c2c;
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        .prova-info { flex: 1; }
        .prova-nome { font-weight: bold; font-size: 0.85rem; color: white; }
        .prova-detalhes { font-size: 0.6rem; color: #aaa; }
        .prova-acoes { display: flex; gap: 8px; }
        .btn-editar-prova { background: #2196f3; padding: 5px 8px; font-size: 0.65rem; margin: 0; width: auto; }
        .btn-excluir-prova { background: #ff4444; padding: 5px 8px; font-size: 0.65rem; margin: 0; width: auto; }
        .slider-container {
            background: #333;
            padding: 8px;
            border-radius: 12px;
            margin-top: 10px;
        }
        .slider-container label { color: white; font-size: 0.65rem; }
        input[type="range"] { width: 100%; margin: 5px 0; }
        .btn-corrigir-auto.ativo { background: #f44336; }
        .instrucao {
            background: rgba(0,0,0,0.6);
            padding: 5px;
            border-radius: 8px;
            font-size: 0.6rem;
            text-align: center;
            color: #ffaa00;
            margin-bottom: 5px;
        }
        .ajuste-container {
            display: flex;
            gap: 8px;
            margin: 5px 0;
            flex-wrap: wrap;
        }
        .ajuste-container button {
            flex: 1;
            min-width: 60px;
            padding: 8px;
            font-size: 0.7rem;
            margin: 2px;
            border-radius: 12px;
        }
        .btn-ajuste { background: #2196f3; color: white; }
        .btn-ajuste-reset { background: #666; color: white; }
        #ajusteInfo {
            color: #aaa;
            text-align: center;
            font-size: 0.65rem;
            padding: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📸 Leitor de Gabarito - 40 Questões</h1>
        </div>
        
        <div class="info-usuario" id="infoUsuario">Carregando...</div>
        <div class="info-prova" id="infoProva">📋 Nenhuma prova selecionada</div>
        <div class="info-gabarito nao-carregado" id="infoGabarito">⚠️ Selecione ou crie uma prova</div>
        
        <div class="status-alinhamento" id="statusAlinhamento">
            🟡 Aguardando câmera...
        </div>
        
        <div class="instrucao" id="instrucao">
            💡 Alinhe a grade VERMELHA sobre os círculos da folha
        </div>
        
        <div class="camera-container">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="overlayCanvas"></canvas>
        </div>
        
        <div class="ajuste-container">
            <button class="btn-ajuste" id="btnMoverCima">⬆</button>
            <button class="btn-ajuste" id="btnMoverBaixo">⬇</button>
            <button class="btn-ajuste" id="btnMoverEsquerda">⬅</button>
            <button class="btn-ajuste" id="btnMoverDireita">➡</button>
            <button class="btn-ajuste-reset" id="btnResetAjuste">⟲ Reset</button>
        </div>
        <div id="ajusteInfo">Ajuste fino: X: 0 | Y: 0</div>
        
        <div class="row-buttons">
            <button class="btn-provas" id="btnGerenciarProvas">📚 Provas</button>
            <button class="btn-corrigir-auto" id="btnCorrigirAuto">🎯 Iniciar Leitura</button>
        </div>
        
        <button class="btn-gabarito" id="btnAbrirGabarito" disabled>📝 Editar Gabarito</button>
        <button class="btn-sair" id="btnSair">🚪 Sair</button>
        
        <div class="slider-container">
            <label>🔧 Limiar (quanto menor, mais sensível):</label>
            <input type="range" id="limiarSlider" min="30" max="150" value="70">
            <span id="limiarValue" style="color:white;">70</span>
            <label style="display:block; margin-top:5px;">📊 Sensibilidade (preenchimento mínimo):</label>
            <input type="range" id="sensibilidadeSlider" min="0.08" max="0.40" step="0.01" value="0.15">
            <span id="sensibilidadeValue" style="color:white;">0.15</span>
        </div>
        
        <div class="resultado-preview" id="resultadoPreview" style="display: none;">
            <div class="acertos-tempo-real" id="acertosTempoReal">- / -</div>
            <div class="nota-tempo-real" id="notaTempoReal">🎓 NOTA: -</div>
            <div class="respostas-grid" id="respostasGrid"></div>
        </div>
    </div>
    
    <!-- Modais -->
    <div id="modalProvas" class="modal">
        <div class="modal-content">
            <h2>📚 Minhas Provas</h2>
            <button class="btn-nova-prova" id="btnNovaProva">➕ Criar Nova Prova</button>
            <div id="listaProvas" class="lista-provas"></div>
            <button id="btnFecharProvas" class="btn-fechar-modal">Fechar</button>
        </div>
    </div>
    
    <div id="modalEditarProva" class="modal">
        <div class="modal-content">
            <h2 id="modalEditarTitulo">📝 Criar Nova Prova</h2>
            <div class="config-item">
                <label>📛 Nome da prova:</label>
                <input type="text" id="provaNome" placeholder="Ex: Prova 1 - Matemática">
            </div>
            <div class="config-item">
                <label>📊 Quantidade de questões:</label>
                <input type="number" id="provaNumQuestoes" min="10" max="100" step="5" value="40">
            </div>
            <div class="config-item">
                <label>🔤 Número de alternativas:</label>
                <select id="provaNumOpcoes">
                    <option value="4" selected>4 opções (A, B, C, D)</option>
                    <option value="5">5 opções (A, B, C, D, E)</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button id="btnCriarProva" class="btn-salvar-gabarito">💾 Criar Prova</button>
                <button id="btnCancelarEdicao" class="btn-fechar-modal">Cancelar</button>
            </div>
        </div>
    </div>
    
    <div id="modalGabarito" class="modal">
        <div class="modal-content">
            <h2 id="modalGabaritoTitulo">📝 Editar Gabarito</h2>
            <div id="gabaritoLista" class="gabarito-grid"></div>
            <div class="modal-buttons">
                <button id="btnSalvarGabarito" class="btn-salvar-gabarito">💾 Salvar</button>
                <button id="btnFecharGabarito" class="btn-fechar-modal">Fechar</button>
            </div>
            <button id="btnResetGabarito" class="btn-reset">🔄 Resetar</button>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ========== CONFIGURAÇÕES ==========
        const SUPABASE_URL = 'https://jmxtiaauezblgkichekx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpteHRpYWF1ZXpibGdraWNoZWt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNDIyNjIsImV4cCI6MjA5NDYxODI2Mn0.jD0KRpdl85Cee24qwmV9nDNntR2Wk48DlJLcJnxoTyg';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Layout: 2 colunas × 20 linhas = 40 questões
        const LINHAS_QUESTOES = 20;
        const COLUNAS_QUESTOES = 2;
        const NUM_OPCOES = 4;
        const OPCOES = ['A', 'B', 'C', 'D'];
        
        let provas = [];
        let provaAtual = null;
        let NUM_QUESTOES = 40;
        let gabarito = [];
        
        // Ajustes manuais da grade
        let ajusteX = 0;
        let ajusteY = 0;
        const PASSO_AJUSTE = 0.005; // Percentual da imagem
        
        const usuarioId = localStorage.getItem('usuario_id');
        const usuarioNome = localStorage.getItem('usuario_nome');
        
        if (!usuarioId) {
            alert('⚠️ Faça login primeiro!');
            window.location.href = 'index.html';
        }
        
        document.getElementById('infoUsuario').innerHTML = `👨‍🏫 ${usuarioNome || 'Professor'}`;
        
        // Elementos
        const video = document.getElementById('video');
        const overlayCanvas = document.getElementById('overlayCanvas');
        const statusAlinhamento = document.getElementById('statusAlinhamento');
        const limiarSlider = document.getElementById('limiarSlider');
        const limiarValue = document.getElementById('limiarValue');
        const sensibilidadeSlider = document.getElementById('sensibilidadeSlider');
        const sensibilidadeValue = document.getElementById('sensibilidadeValue');
        
        let stream = null;
        let limiarDetecao = 70;
        let sensibilidadeCirculo = 0.15;
        let leituraAtiva = false;
        let frameInterval = null;
        
        limiarSlider.addEventListener('input', (e) => {
            limiarDetecao = parseInt(e.target.value);
            limiarValue.textContent = limiarDetecao;
        });
        
        sensibilidadeSlider.addEventListener('input', (e) => {
            sensibilidadeCirculo = parseFloat(e.target.value);
            sensibilidadeValue.textContent = sensibilidadeCirculo;
        });
        
        // Controles de ajuste fino
        document.getElementById('btnMoverCima').addEventListener('click', () => {
            ajusteY -= PASSO_AJUSTE;
            atualizarAjusteInfo();
        });
        document.getElementById('btnMoverBaixo').addEventListener('click', () => {
            ajusteY += PASSO_AJUSTE;
            atualizarAjusteInfo();
        });
        document.getElementById('btnMoverEsquerda').addEventListener('click', () => {
            ajusteX -= PASSO_AJUSTE;
            atualizarAjusteInfo();
        });
        document.getElementById('btnMoverDireita').addEventListener('click', () => {
            ajusteX += PASSO_AJUSTE;
            atualizarAjusteInfo();
        });
        document.getElementById('btnResetAjuste').addEventListener('click', () => {
            ajusteX = 0;
            ajusteY = 0;
            atualizarAjusteInfo();
        });
        
        function atualizarAjusteInfo() {
            document.getElementById('ajusteInfo').textContent = 
                `Ajuste fino: X: ${(ajusteX * 100).toFixed(1)}% | Y: ${(ajusteY * 100).toFixed(1)}%`;
        }
        
        // ========== FUNÇÕES SUPABASE ==========
        async function garantirUsuarioExistente() {
            const { data: existe } = await supabaseClient
                .from('usuarios')
                .select('id')
                .eq('id', usuarioId)
                .maybeSingle();
            
            if (!existe) {
                await supabaseClient.from('usuarios').insert([{
                    id: usuarioId,
                    nome: usuarioNome || 'Professor',
                    email: localStorage.getItem('usuario_email') || '',
                    criado_em: new Date().toISOString()
                }]);
            }
        }
        
        async function carregarProvasDoSupabase() {
            try {
                const { data, error } = await supabaseClient
                    .from('provas')
                    .select('*')
                    .eq('usuario_id', usuarioId)
                    .order('criado_em', { ascending: false });
                
                if (error) throw error;
                
                provas = data || [];
                renderizarListaProvas();
                
                if (provas.length === 0) {
                    document.getElementById('infoProva').innerHTML = '📋 Nenhuma prova';
                } else if (!provaAtual) {
                    await selecionarProva(provas[0].id);
                }
            } catch (err) {
                console.error(err);
            }
        }
        
        async function selecionarProva(provaId) {
            try {
                const { data, error } = await supabaseClient
                    .from('provas')
                    .select('*')
                    .eq('id', provaId)
                    .single();
                
                if (error) throw error;
                
                provaAtual = data;
                NUM_QUESTOES = data.num_questoes;
                gabarito = [...data.gabarito];
                
                document.getElementById('infoProva').innerHTML = `📋 ${provaAtual.nome_prova} (${NUM_QUESTOES}q)`;
                document.getElementById('infoGabarito').innerHTML = `✅ Gabarito carregado!`;
                document.getElementById('infoGabarito').className = 'info-gabarito carregado';
                document.getElementById('btnAbrirGabarito').disabled = false;
                document.getElementById('modalProvas').style.display = 'none';
            } catch (err) {
                console.error(err);
            }
        }
        
        async function salvarProva(nome, numQuestoes, numOpcoes, editId = null) {
            const opcoes = Array(numOpcoes).fill().map((_, i) => String.fromCharCode(65 + i));
            const novoGabarito = new Array(numQuestoes).fill(opcoes[0]);
            
            if (editId) {
                await supabaseClient.from('provas').update({
                    nome_prova: nome, num_questoes: numQuestoes,
                    opcoes_por_questao: numOpcoes, gabarito: novoGabarito
                }).eq('id', editId);
            } else {
                await supabaseClient.from('provas').insert([{
                    usuario_id: usuarioId, nome_prova: nome,
                    num_questoes: numQuestoes, opcoes_por_questao: numOpcoes,
                    gabarito: novoGabarito
                }]);
            }
            await carregarProvasDoSupabase();
        }
        
        async function excluirProva(provaId) {
            if (!confirm('Excluir esta prova?')) return;
            await supabaseClient.from('provas').delete().eq('id', provaId);
            if (provaAtual && provaAtual.id === provaId) {
                provaAtual = null;
                document.getElementById('btnAbrirGabarito').disabled = true;
            }
            await carregarProvasDoSupabase();
        }
        
        async function salvarGabaritoProvaAtual() {
            if (!provaAtual) return;
            await supabaseClient.from('provas').update({ gabarito: gabarito }).eq('id', provaAtual.id);
            alert('✅ Gabarito salvo!');
            document.getElementById('modalGabarito').style.display = 'none';
        }
        
        function renderizarListaProvas() {
            const container = document.getElementById('listaProvas');
            if (provas.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:20px; color:#aaa;">Nenhuma prova</div>';
                return;
            }
            container.innerHTML = provas.map(prova => `
                <div class="prova-item" data-id="${prova.id}">
                    <div class="prova-info">
                        <div class="prova-nome">${prova.nome_prova}</div>
                        <div class="prova-detalhes">${prova.num_questoes} questões</div>
                    </div>
                    <div class="prova-acoes">
                        <button class="btn-editar-prova" data-id="${prova.id}">✏️</button>
                        <button class="btn-excluir-prova" data-id="${prova.id}">🗑️</button>
                    </div>
                </div>
            `).join('');
            
            document.querySelectorAll('.prova-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('btn-editar-prova') && !e.target.classList.contains('btn-excluir-prova')) {
                        selecionarProva(item.dataset.id);
                    }
                });
            });
            
            document.querySelectorAll('.btn-editar-prova').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const prova = provas.find(p => p.id == btn.dataset.id);
                    if (prova) {
                        document.getElementById('provaNome').value = prova.nome_prova;
                        document.getElementById('provaNumQuestoes').value = prova.num_questoes;
                        document.getElementById('provaNumOpcoes').value = prova.opcoes_por_questao || 4;
                        document.getElementById('modalEditarTitulo').innerHTML = '✏️ Editar Prova';
                        document.getElementById('modalEditarProva').dataset.editId = prova.id;
                        document.getElementById('modalEditarProva').style.display = 'block';
                        document.getElementById('modalProvas').style.display = 'none';
                    }
                });
            });
            
            document.querySelectorAll('.btn-excluir-prova').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    e.stopPropagation();
                    await excluirProva(btn.dataset.id);
                });
            });
        }
        
        function renderizarModalGabarito() {
            const container = document.getElementById('gabaritoLista');
            container.innerHTML = '';
            for (let i = 0; i < NUM_QUESTOES; i++) {
                const div = document.createElement('div');
                div.className = 'gab-item';
                div.innerHTML = `<label>Q${i+1}</label>
                    <select id="gabSelect_${i}" data-questao="${i}">
                        ${OPCOES.map(op => `<option value="${op}" ${gabarito[i] === op ? 'selected' : ''}>${op}</option>`).join('')}
                    </select>`;
                container.appendChild(div);
            }
            for (let i = 0; i < NUM_QUESTOES; i++) {
                document.getElementById(`gabSelect_${i}`)?.addEventListener('change', (e) => {
                    gabarito[parseInt(e.target.dataset.questao)] = e.target.value;
                });
            }
        }
        
        // ========== CÂMERA E DETECÇÃO ==========
        async function iniciarCamera() {
            if (stream) stream.getTracks().forEach(track => track.stop());
            statusAlinhamento.innerHTML = '📷 Solicitando câmera...';
            
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" }, width: { ideal: 1080 }, height: { ideal: 1920 } }
                });
                video.srcObject = stream;
                await new Promise(resolve => { video.onloadedmetadata = () => { video.play(); resolve(); }; });
                statusAlinhamento.innerHTML = '🟡 Alinhe a grade com os círculos da folha';
                document.getElementById('btnCorrigirAuto').disabled = false;
            } catch (err) {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                    await video.play();
                    statusAlinhamento.innerHTML = '🟡 Alinhe a grade com os círculos';
                } catch (e) {
                    statusAlinhamento.innerHTML = '❌ Erro na câmera';
                }
            }
        }
        
        function iniciarLeitura() {
            if (frameInterval) clearInterval(frameInterval);
            leituraAtiva = true;
            document.getElementById('btnCorrigirAuto').innerHTML = '⏹️ Parar Leitura';
            document.getElementById('btnCorrigirAuto').classList.add('ativo');
            frameInterval = setInterval(() => {
                if (leituraAtiva && video.videoWidth > 0 && provaAtual) processarFrame();
            }, 500);
        }
        
        function pararLeitura() {
            if (frameInterval) clearInterval(frameInterval);
            leituraAtiva = false;
            document.getElementById('btnCorrigirAuto').innerHTML = '🎯 Iniciar Leitura';
            document.getElementById('btnCorrigirAuto').classList.remove('ativo');
            const ctx = overlayCanvas.getContext('2d');
            if (ctx) ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
        }
        
        function processarFrame() {
            if (!provaAtual || !video.videoWidth) return;
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = video.videoWidth;
            tempCanvas.height = video.videoHeight;
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
            
            // Processamento
            const targetWidth = 1000;
            const scale = targetWidth / tempCanvas.width;
            const targetHeight = Math.floor(tempCanvas.height * scale);
            
            const canvas = document.createElement('canvas');
            canvas.width = targetWidth;
            canvas.height = targetHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(tempCanvas, 0, 0, targetWidth, targetHeight);
            
            // Configura overlay
            overlayCanvas.width = targetWidth;
            overlayCanvas.height = targetHeight;
            const overlayCtx = overlayCanvas.getContext('2d');
            
            const imageData = ctx.getImageData(0, 0, targetWidth, targetHeight);
            const dados = new Uint8ClampedArray(imageData.data);
            
            // ===== LAYOUT: 2 COLUNAS × 20 LINHAS =====
            // Ajuste fino aplicado
            const ajusteXPx = ajusteX * targetWidth;
            const ajusteYPx = ajusteY * targetHeight;
            
            const areaTopo = targetHeight * 0.20 + ajusteYPx;
            const areaBaixo = targetHeight * 0.88 + ajusteYPx;
            const areaEsquerda = targetWidth * 0.10 + ajusteXPx;
            const areaDireita = targetWidth * 0.90 + ajusteXPx;
            
            const cellWidth = (areaDireita - areaEsquerda) / COLUNAS_QUESTOES;
            const cellHeight = (areaBaixo - areaTopo) / LINHAS_QUESTOES;
            
            const opcaoWidth = cellWidth / (NUM_OPCOES + 0.7);
            const circleRadius = Math.min(cellWidth, cellHeight) * 0.12;
            
            overlayCtx.clearRect(0, 0, targetWidth, targetHeight);
            overlayCtx.globalAlpha = 0.85;
            
            // Desenha a área de detecção (VERMELHO)
            overlayCtx.strokeStyle = '#ff0000';
            overlayCtx.lineWidth = 3;
            overlayCtx.strokeRect(areaEsquerda, areaTopo, areaDireita - areaEsquerda, areaBaixo - areaTopo);
            
            // Desenha a grade
            overlayCtx.strokeStyle = '#ff6666';
            overlayCtx.lineWidth = 1;
            // Linha vertical separando as colunas
            const xMeio = areaEsquerda + cellWidth;
            overlayCtx.beginPath();
            overlayCtx.moveTo(xMeio, areaTopo);
            overlayCtx.lineTo(xMeio, areaBaixo);
            overlayCtx.stroke();
            
            // Linhas horizontais
            for (let i = 1; i < LINHAS_QUESTOES; i++) {
                const y = areaTopo + i * cellHeight;
                overlayCtx.beginPath();
                overlayCtx.moveTo(areaEsquerda, y);
                overlayCtx.lineTo(areaDireita, y);
                overlayCtx.stroke();
            }
            
            function isPixelDark(x, y) {
                if (x < 0 || x >= targetWidth || y < 0 || y >= targetHeight) return false;
                const idx = (Math.floor(y) * targetWidth + Math.floor(x)) * 4;
                const brilho = (dados[idx] * 0.299 + dados[idx+1] * 0.587 + dados[idx+2] * 0.114);
                return brilho < limiarDetecao;
            }
            
            function calcularPreenchimento(cx, cy, raio) {
                let escuros = 0, total = 0;
                const raioInt = Math.floor(raio);
                for (let dy = -raioInt; dy <= raioInt; dy++) {
                    for (let dx = -raioInt; dx <= raioInt; dx++) {
                        if (dx*dx + dy*dy <= raio * raio) {
                            total++;
                            if (isPixelDark(cx + dx, cy + dy)) escuros++;
                        }
                    }
                }
                return total > 0 ? escuros / total : 0;
            }
            
            function verificarPreenchimentoRobusto(cx, cy, raio) {
                const raioTest = raio * 0.7;
                let pontuacao = 0;
                const pontos = [
                    [0, 0, 1.0],
                    [-raioTest * 0.6, -raioTest * 0.6, 0.6],
                    [raioTest * 0.6, -raioTest * 0.6, 0.6],
                    [-raioTest * 0.6, raioTest * 0.6, 0.6],
                    [raioTest * 0.6, raioTest * 0.6, 0.6],
                    [0, -raioTest * 0.9, 0.4],
                    [0, raioTest * 0.9, 0.4]
                ];
                
                for (const [dx, dy, peso] of pontos) {
                    const px = cx + dx;
                    const py = cy + dy;
                    if (px >= 0 && px < targetWidth && py >= 0 && py < targetHeight) {
                        const idx = (Math.floor(py) * targetWidth + Math.floor(px)) * 4;
                        const brilho = (dados[idx] * 0.299 + dados[idx+1] * 0.587 + dados[idx+2] * 0.114);
                        if (brilho < limiarDetecao * 1.2) {
                            pontuacao += peso;
                        }
                    }
                }
                return pontuacao / 4.2;
            }
            
            const respostas = [];
            let questoesDetectadas = 0;
            let questaoIndex = 0;
            
            for (let linha = 0; linha < LINHAS_QUESTOES; linha++) {
                for (let coluna = 0; coluna < COLUNAS_QUESTOES; coluna++) {
                    if (questaoIndex >= NUM_QUESTOES) break;
                    
                    const cellX = areaEsquerda + coluna * cellWidth;
                    const cellY = areaTopo + linha * cellHeight;
                    const cellCenterX = cellX + cellWidth / 2;
                    const cellCenterY = cellY + cellHeight / 2;
                    
                    let melhorOpcao = -1;
                    let maiorPreenchimento = 0;
                    let totalPreenchidas = 0;
                    
                    for (let opt = 0; opt < NUM_OPCOES; opt++) {
                        const opcaoX = cellX + (opt + 0.6) * opcaoWidth;
                        const opcaoY = cellCenterY;
                        
                        const preenchimento = verificarPreenchimentoRobusto(opcaoX, opcaoY, circleRadius);
                        
                        overlayCtx.beginPath();
                        overlayCtx.arc(opcaoX, opcaoY, circleRadius, 0, 2 * Math.PI);
                        
                        if (preenchimento > sensibilidadeCirculo) {
                            const intensidade = Math.min(preenchimento * 2, 0.9);
                            overlayCtx.fillStyle = `rgba(0, 255, 0, ${intensidade})`;
                            overlayCtx.fill();
                            overlayCtx.strokeStyle = '#00ff00';
                            totalPreenchidas++;
                            if (preenchimento > maiorPreenchimento) {
                                maiorPreenchimento = preenchimento;
                                melhorOpcao = opt;
                            }
                        } else {
                            overlayCtx.strokeStyle = '#ff8888';
                            if (preenchimento > 0.05) {
                                overlayCtx.fillStyle = `rgba(255, 255, 0, ${preenchimento * 0.4})`;
                                overlayCtx.fill();
                            }
                        }
                        overlayCtx.stroke();
                        
                        overlayCtx.font = `${Math.max(8, circleRadius)}px Arial`;
                        overlayCtx.fillStyle = 'white';
                        overlayCtx.textAlign = 'center';
                        overlayCtx.textBaseline = 'middle';
                        overlayCtx.fillText(OPCOES[opt], opcaoX, opcaoY);
                    }
                    
                    // Número da questão
                    const numQuestao = questaoIndex + 1;
                    overlayCtx.font = `bold ${Math.max(8, circleRadius + 1)}px Arial`;
                    overlayCtx.fillStyle = '#ffff00';
                    overlayCtx.textAlign = 'left';
                    overlayCtx.textBaseline = 'top';
                    overlayCtx.fillText(`${numQuestao}`, cellX + 3, cellY + 3);
                    
                    if (totalPreenchidas === 1 && melhorOpcao >= 0) {
                        respostas.push(OPCOES[melhorOpcao]);
                        questoesDetectadas++;
                        overlayCtx.fillStyle = 'rgba(0,255,0,0.12)';
                        overlayCtx.fillRect(cellX, cellY, cellWidth, cellHeight);
                    } else if (totalPreenchidas > 1) {
                        respostas.push(null);
                        overlayCtx.fillStyle = 'rgba(255,255,0,0.15)';
                        overlayCtx.fillRect(cellX, cellY, cellWidth, cellHeight);
                    } else {
                        respostas.push(null);
                        overlayCtx.fillStyle = 'rgba(255,0,0,0.05)';
                        overlayCtx.fillRect(cellX, cellY, cellWidth, cellHeight);
                    }
                    
                    questaoIndex++;
                }
                if (questaoIndex >= NUM_QUESTOES) break;
            }
            
            // Atualiza interface
            let acertos = 0;
            const detalhes = [];
            for (let i = 0; i < NUM_QUESTOES; i++) {
                const aluno = respostas[i];
                const correto = gabarito[i];
                if (aluno === null) {
                    detalhes.push({ num: i+1, aluno: '⚪', certo: false });
                } else {
                    const certo = (aluno === correto);
                    if (certo) acertos++;
                    detalhes.push({ num: i+1, aluno: aluno, certo: certo });
                }
            }
            
            const nota = (acertos / NUM_QUESTOES) * 10;
            document.getElementById('resultadoPreview').style.display = 'block';
            document.getElementById('acertosTempoReal').innerHTML = `✅ ${acertos} / ${NUM_QUESTOES}`;
            document.getElementById('notaTempoReal').innerHTML = `🎓 NOTA: ${nota.toFixed(1)}`;
            
            const grid = document.getElementById('respostasGrid');
            grid.innerHTML = detalhes.map(d => `
                <div class="resposta-item ${d.aluno === '⚪' ? 'resposta-nao-detectada' : (d.certo ? 'resposta-certa' : 'resposta-errada')}">
                    ${d.num}<br>${d.aluno}
                </div>
            `).join('');
            
            const pctDetectado = (questoesDetectadas / NUM_QUESTOES) * 100;
            if (pctDetectado > 85) {
                statusAlinhamento.innerHTML = `✅ Excelente! ${questoesDetectadas}/${NUM_QUESTOES} detectadas`;
                statusAlinhamento.className = 'status-alinhamento good';
            } else if (pctDetectado > 50) {
                statusAlinhamento.innerHTML = `🟡 ${questoesDetectadas}/${NUM_QUESTOES} - Ajuste o enquadramento`;
                statusAlinhamento.className = 'status-alinhamento warning';
            } else {
                statusAlinhamento.innerHTML = `🔴 ${questoesDetectadas}/${NUM_QUESTOES} - Use os botões de ajuste fino`;
                statusAlinhamento.className = '';
            }
        }
        
        // ========== EVENTOS ==========
        document.getElementById('btnCorrigirAuto').addEventListener('click', () => {
            if (leituraAtiva) pararLeitura();
            else iniciarLeitura();
        });
        
        document.getElementById('btnGerenciarProvas').addEventListener('click', () => {
            renderizarListaProvas();
            document.getElementById('modalProvas').style.display = 'block';
        });
        
        document.getElementById('btnNovaProva').addEventListener('click', () => {
            document.getElementById('provaNome').value = '';
            document.getElementById('provaNumQuestoes').value = 40;
            document.getElementById('provaNumOpcoes').value = 4;
            document.getElementById('modalEditarTitulo').innerHTML = '📝 Criar Prova';
            delete document.getElementById('modalEditarProva').dataset.editId;
            document.getElementById('modalEditarProva').style.display = 'block';
            document.getElementById('modalProvas').style.display = 'none';
        });
        
        document.getElementById('btnCriarProva').addEventListener('click', async () => {
            const nome = document.getElementById('provaNome').value.trim();
            const numQuestoes = parseInt(document.getElementById('provaNumQuestoes').value);
            const numOpcoes = parseInt(document.getElementById('provaNumOpcoes').value);
            if (!nome) { alert('Digite um nome!'); return; }
            const editId = document.getElementById('modalEditarProva').dataset.editId;
            await salvarProva(nome, numQuestoes, numOpcoes, editId);
            document.getElementById('modalEditarProva').style.display = 'none';
            alert(`✅ Prova "${nome}" salva!`);
        });
        
        document.getElementById('btnFecharProvas').addEventListener('click', () => {
            document.getElementById('modalProvas').style.display = 'none';
        });
        
        document.getElementById('btnCancelarEdicao').addEventListener('click', () => {
            document.getElementById('modalEditarProva').style.display = 'none';
        });
        
        document.getElementById('btnAbrirGabarito').addEventListener('click', () => {
            if (!provaAtual) { alert('Selecione uma prova!'); return; }
            renderizarModalGabarito();
            document.getElementById('modalGabarito').style.display = 'block';
        });
        
        document.getElementById('btnSalvarGabarito').addEventListener('click', async () => {
            await salvarGabaritoProvaAtual();
        });
        
        document.getElementById('btnFecharGabarito').addEventListener('click', () => {
            document.getElementById('modalGabarito').style.display = 'none';
        });
        
        document.getElementById('btnResetGabarito').addEventListener('click', () => {
            if (confirm('Resetar gabarito?')) {
                gabarito = new Array(NUM_QUESTOES).fill('A');
                renderizarModalGabarito();
            }
        });
        
        document.querySelectorAll('.modal').forEach(modal => {
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
        });
        
        document.getElementById('btnSair').addEventListener('click', () => {
            pararLeitura();
            if (stream) stream.getTracks().forEach(t => t.stop());
            localStorage.clear();
            window.location.href = 'index.html';
        });
        
        // Inicialização
        async function iniciar() {
            await garantirUsuarioExistente();
            await carregarProvasDoSupabase();
            iniciarCamera();
        }
        
        iniciar();
    </script>
</body>
